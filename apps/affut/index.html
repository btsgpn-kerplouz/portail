<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#241d15">
<title>À l'affût — carnet de veille naturaliste</title>

<!--
  Lot 1 (voir AVANCEMENT.md) : la page « Numéro », un seul numéro (n°12),
  données en dur, pas de backend, pas de persistance. Bascule rédaction /
  vue publiée réelle, décochage de blocs réel.

  Lot 2 (voir AVANCEMENT.md) : persistance dans localStorage (clé
  "affut:numero:12"), formulaire modal d'ajout/édition/suppression
  d'entrée, édition en place (titre, résumé, méta source, chapô…) qui
  écrit réellement dans le modèle et survit au rechargement. Un seul
  numéro toujours — le multi-numéro est renvoyé au Lot 3.

  Lot 3 (voir AVANCEMENT.md) : plusieurs numéros fictifs (n°5 à n°12),
  écran Sommaire (regroupement par mois, mois les plus anciens repliés)
  et écran Recherche transversale (actualités + leurs sources, filtrée
  par rubrique). Persistance passée à la clé "affut:numeros" (un tableau
  de numéros, chacun avec ses propres entrées) ; l'ancienne clé
  "affut:numero:12" est migrée automatiquement une fois si elle existe,
  pour ne pas perdre les données de test du lot 2.
  Écarts assumés (30/08/2026) :
  - Pas de routage par URL/hash : la navigation numéro ↔ sommaire ↔
    recherche est un simple état en mémoire, pas de lien permanent.
  - La recherche se déclenche par soumission (bouton « Chercher » /
    Entrée), pas au fil de la frappe : l'affichage se reconstruit
    entièrement à chaque rendu, une recherche « live » ferait perdre le
    focus du champ à chaque caractère.
  - Filtre par rubrique seulement (pas d'échelle ni d'année scolaire,
    présents dans le dossier de passation) : suffisant pour valider la
    navigation, les autres filtres pourront revenir plus tard.
  - « Les sources » de la recherche liste les documents des actualités
    trouvées (pas une recherche indépendante sur les seuls documents).
  - Sommaire et Recherche sont toujours en lecture publique : la bascule
    Rédaction / Vue publiée ne concerne que l'écran d'un numéro ouvert.
  - Comme au lot 2, le résumé n'accepte pas de balise <em> : toujours
    échappé avant affichage, y compris dans les extraits de recherche.

  Lot 4 (voir AVANCEMENT.md) : écran « Sources suivies » (5a), les 6 états
  limites (4b) et la feuille d'impression (4c). Numéro 13 ajouté comme
  brouillon avec sa moisson (candidats non triés) et son statut de
  collecte — c'est le terrain d'exercice organique des états ②③④. Les
  QR codes d'impression sont générés à la volée avec vendor/qrcode.js
  (Kazuhiko Arase, MIT, vendorisé tel quel — voir ce fichier).
  Voir « Décisions arrêtées » dans AVANCEMENT.md pour le détail des choix
  (déclenchement des états, validation de publication…).

  Jetons repris de documents/GitHub repo et directions de design(5)/
  design_handoff_carnet_veille/jetons.css, préfixe renommé --cv- → --af-.
-->
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('./fonts/ibm-plex-sans.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Serif';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/ibm-plex-serif-bold.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/jetbrains-mono.woff2') format('woff2')}

:root{
  --af-fond:            #fbf6ea;
  --af-surface:         #fffdf6;
  --af-surface-2:       #f5ead4;
  --af-surface-3:       #f0e4cd;

  --af-bandeau:         #241d15;
  --af-sur-bandeau:     #fdf8ec;
  --af-sur-bandeau-2:   #efe3cd;
  --af-sur-bandeau-3:   #b3a893;
  --af-filet-bandeau:   #55483a;

  --af-filet-fin:       #eadfc8;
  --af-filet:           #ddd2ba;
  --af-filet-moyen:     #c9b896;
  --af-filet-fort:      #9b8655; /* assombri (lot 5, audit RGAA) : #b9a87f ne tenait que 2,3:1 sur --af-surface, sous le seuil 3:1 (WCAG 1.4.11) pour les bordures de champs/boutons */

  --af-encre:           #1a1611;
  --af-encre-courant:   #2b241c;
  --af-encre-2:         #4a4136;
  --af-encre-3:         #6f6355;
  --af-brun-rubrique:   #5b3d1f;
  --af-filet-pastille:  #b79b6c;

  --af-accent:          #8a2f39;
  --af-sur-accent:      #fffdf6;
  --af-sur-accent-2:    #f2ced2;

  --af-valide:          #196549;
  --af-mort:            #A6421B;

  --af-prive:           #7a5b16;
  --af-prive-fond:      #f4ead0;
  --af-prive-champ:     #f9f2e3;
  --af-prive-texte:     #5c4410;
  --af-prive-texte-2:   #4a3a10;
  --af-prive-hachure:   rgba(122,91,22,.32);

  --af-edit-fond:       #f7edee;
  --af-edit-pointille:  #b98088;
  --af-edit-halo:       0 0 0 3px rgba(138,47,57,.15);
  --af-surlignage-fond: #f2d78a;

  /* Repère de mode rédaction — repris de l'ambre « en chantier » du portail */
  --af-redaction:       #8a5f17;
  --af-sur-redaction:   #fffdf6;

  /* Impression (lot 4) — deux papiers seulement, celui-ci est le second */
  --af-print-encre:     #000000;
  --af-print-papier:    #ffffff;

  --af-police:          'IBM Plex Sans', system-ui, sans-serif;
  --af-police-mono:     'JetBrains Mono', monospace;
  --af-police-serif:    'IBM Plex Serif', Georgia, serif;
}

*{box-sizing:border-box}
/* lot 5, audit RGAA : titre de page pour les lecteurs d'écran, sans
   impact visuel — le Sommaire, la Recherche et les Sources n'avaient
   aucun <h1> (seul le bandeau de navigation, pas une vraie structure de
   titres, indiquait la page en cours). */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html,body{color-scheme:light}
body{margin:0;background:var(--af-fond);color:var(--af-encre-courant);font-family:var(--af-police);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
ul{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--af-encre);outline-offset:2px}
.tab-num{font-variant-numeric:tabular-nums}

/* ---- coquille de l'app ---- */
.page{padding:26px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.app{width:100%;max-width:1360px;border:1px solid var(--af-encre);background:var(--af-fond);transition:max-width .15s ease}
.app.vue-sommaire{max-width:1560px}
.app.mode-redaction{
  max-width:1560px;
  border-color:var(--af-redaction);
  /* papier plus neutre/atelier, distinct du crème de lecture */
  --af-fond:      #eee7d7;
  --af-surface:   #f8f3e6;
  --af-surface-2: #e5ddc6;
  --af-surface-3: #ded4b7;
  --af-filet:     #ccc0a0;
  --af-filet-fin: #d8cba8;
}
.app-liw{height:5px;background:var(--af-accent)}
.mode-redaction .app-liw{background:var(--af-redaction)}

.mode-banniere{background:var(--af-redaction);color:var(--af-sur-redaction);padding:6px 22px;font-family:var(--af-police-mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center}

.bandeau{background:var(--af-bandeau);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-align:left}
.brand svg{flex:none}
.brand-name{font-family:var(--af-police-mono);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--af-sur-bandeau)}
.brand-sub{font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-sur-bandeau-3)}
.bandeau-spacer{flex:1}
.mode-toggle{display:flex;align-items:center}
.mode-toggle button{font-family:var(--af-police-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 13px;border:1px solid var(--af-filet-bandeau)}
.mode-toggle button[aria-pressed="true"]{background:var(--af-sur-bandeau);color:var(--af-encre);font-weight:700;border-color:var(--af-sur-bandeau)}
.mode-toggle button[aria-pressed="false"]{color:var(--af-sur-bandeau-2)}
.mode-toggle button[data-mode="redaction"][aria-pressed="true"]{background:var(--af-redaction);color:var(--af-sur-redaction);border-color:var(--af-redaction)}
.bandeau-nav{display:flex;align-items:center}
.bandeau-nav button{font-family:var(--af-police-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 13px;border:1px solid var(--af-filet-bandeau);color:var(--af-sur-bandeau-2)}
.bandeau-nav button:hover{color:var(--af-sur-bandeau)}
.bandeau-nav button[aria-current="page"]{background:var(--af-sur-bandeau);color:var(--af-encre);font-weight:700;border-color:var(--af-sur-bandeau)}
/* Lot 7 : statut de connexion, même famille visuelle que .bandeau-nav
   (fond sombre du bandeau — .lien-action, pensé pour la rédaction sur fond
   clair, y serait illisible). */
.auth-statut{display:flex;align-items:center;gap:8px;font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-sur-bandeau-3);padding-left:16px}
.auth-statut button,button[data-action="ouvrir-connexion"]{font-family:var(--af-police-mono);font-size:11px;color:var(--af-sur-bandeau-3);text-decoration:underline;text-underline-offset:2px;padding-left:16px}
.auth-statut button:hover,button[data-action="ouvrir-connexion"]:hover{color:var(--af-sur-bandeau-2)}

/* ---- en-tête du numéro ---- */
.numero-entete{background:var(--af-surface-2);border-bottom:1px solid var(--af-filet);padding:18px 22px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.entete-principal{display:flex;flex-direction:column;gap:8px;max-width:820px;flex:1;min-width:260px}
.entete-num-ligne{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.entete-num-badge{background:var(--af-accent);color:var(--af-sur-accent);font-family:var(--af-police-mono);font-weight:700;font-size:25px;letter-spacing:-.02em;padding:7px 15px;display:inline-flex;align-items:baseline;gap:7px}
.mode-redaction .entete-num-badge{background:var(--af-redaction);color:var(--af-sur-redaction)}
.entete-num-badge .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.lien-num-edit{font-size:15px;color:var(--af-encre-3);padding:2px 4px}
.lien-num-edit:hover{color:var(--af-redaction)}
.entete-semaine{font-family:var(--af-police-mono);font-size:12px;color:var(--af-encre-2)}
.entete-titre{margin:0;font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.2;color:var(--af-encre)}
.entete-chapo{font-size:13.5px;line-height:1.55;color:var(--af-encre-2)}
.entete-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.select-numero-wrap{display:flex;align-items:center;gap:8px}
.select-numero-wrap .lbl{font-family:var(--af-police-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--af-encre-3)}
.select-numero{font:inherit;font-family:var(--af-police-mono);font-size:12.5px;padding:7px 10px;border:1px solid var(--af-redaction);background:var(--af-surface);color:var(--af-encre-courant)}
.entete-compteur{display:flex;align-items:baseline;gap:7px}
.entete-compteur .n{font-family:var(--af-police-mono);font-size:19px;font-weight:700;color:var(--af-valide)}
.entete-compteur .l{font-family:var(--af-police-mono);font-size:12px;color:var(--af-encre-3)}
.entete-boutons{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn-ligne{font-family:var(--af-police-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 13px;border:1px solid var(--af-redaction);color:var(--af-redaction)}
.btn-ligne.danger{border-color:var(--af-mort);color:var(--af-mort)}
.btn-ligne.danger:hover{background:var(--af-mort);color:var(--af-sur-accent)}
.btn-plein{font-family:var(--af-police-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 15px;font-weight:700;background:var(--af-redaction);color:var(--af-sur-redaction)}

/* ---- corps : une seule colonne pleine largeur, rédaction et vue publiée
   (le rail à droite d'un numéro publié a été retiré le 01/09/2026, doublon
   inutile avec le bouton « Ouvrir la source » déjà sur chaque entrée) ---- */
.corps{display:block}

.rubrique-tete{background:var(--af-surface-3);border-top:1px solid var(--af-filet);border-bottom:1px solid var(--af-filet);padding:7px 20px;display:flex;align-items:center;gap:12px}
.rubrique-tete .nom{font-family:var(--af-police-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--af-brun-rubrique)}
.rubrique-tete .filet{flex:1;height:1px;background:var(--af-filet-moyen)}
.rubrique-tete .position{font-family:var(--af-police-mono);font-size:10px;color:var(--af-encre-3)}

/* ---- entrée : ligne aplatie ---- */
.entree{border-bottom:1px solid var(--af-filet)}
.mode-publiee .entree:last-child{border-bottom:0}

.entree-row{display:flex;align-items:center;min-height:64px}
.entree-row-gauche{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 16px}
.mode-publiee .entree-row{align-items:stretch}
.valide-case{flex:none;margin-top:0}

/* ---- ordre des entrées au sein d'une rubrique (lot 10bis) ---- */
.reorder-btns{flex:none;display:flex;flex-direction:column;gap:2px}
.btn-reorder{width:20px;height:18px;padding:0;line-height:1;font-size:9px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-2)}
.btn-reorder:hover:not(:disabled){background:var(--af-redaction);color:var(--af-sur-redaction);border-color:var(--af-redaction)}
.btn-reorder:disabled{opacity:.3}


.etat-pastille{flex:none;font-family:var(--af-police-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--af-encre-3);white-space:nowrap}
.etat-pastille.ok{color:var(--af-valide)}
.etat-pastille.mort{color:var(--af-mort)}

.flat{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.flat-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 8px;font-size:11.5px}
.flat-meta .nom{font-weight:700;color:var(--af-encre)}
.pastille-echelle{font-family:var(--af-police-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--af-brun-rubrique);border:1px solid var(--af-filet-pastille);padding:0 5px}
/* Pastille de rubrique (Lot 17) : remplace les sections/titres de
   rubrique retirés de l'écran — pleine plutôt que juste contourée
   (contrairement à .pastille-echelle) pour rester le repère principal de
   catégorisation malgré sa petite taille, en premier dans .flat-meta. */
.pastille-rubrique{font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--af-sur-accent);background:var(--af-brun-rubrique);padding:1px 6px}
.flat-meta .meta-mono{font-family:var(--af-police-mono);font-size:10px;color:var(--af-encre-3)}
.flat-titre{font-size:15.5px;font-weight:700;line-height:1.3;color:var(--af-accent)}
.mode-redaction .flat-titre{color:var(--af-encre)}
/* Titre-bouton mobile en rédaction (Lot 20) : reset des styles de bouton du
   navigateur, garde la mise en forme de .flat-titre. */
.flat-titre-bouton{display:flex;align-items:baseline;gap:6px;width:100%;font:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.flat-titre-bouton:hover{text-decoration:underline}
.flat-titre-chevron{flex:none;color:var(--af-encre-3);font-weight:400}
.bloc-ligne{display:flex;align-items:flex-start;gap:8px}
.bloc-ligne .case-bloc{margin-top:2px}
.bloc-masque-texte{flex:1;min-width:0;font-family:var(--af-police-mono);font-size:10px;color:var(--af-encre-3);padding-top:1px}
.flat-chiffres{flex:1;min-width:0;font-family:var(--af-police-mono);font-size:11px;color:var(--af-encre-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flat-chiffres b{display:inline-block;font-weight:700;background:var(--af-accent);color:var(--af-sur-accent);padding:1px 6px;margin-right:1px}
.mode-redaction .flat-chiffres b [data-ed="true"]{color:var(--af-encre-courant)}
.flat-resume{flex:1;min-width:0;font-size:12.5px;line-height:1.45;color:var(--af-encre-2)}

.entree-row-droite{flex:none;display:flex;flex-direction:row;align-items:center;gap:18px;padding-right:4px}
.entree-droite-colonne{flex:none;display:flex;flex-direction:column;gap:6px}
.entree-image{flex:none;width:118px;height:88px;object-fit:cover;border:1px solid var(--af-filet-fort);transform:rotate(-2deg);box-shadow:0 4px 10px rgba(26,22,17,.28)}
.btn-source-compact{flex:1;width:200px;min-height:52px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;background:var(--af-accent);color:var(--af-sur-accent);text-decoration:none;padding:8px 13px}
.btn-source-compact .lib{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn-source-compact .lib .fleche{font-size:14px}
.btn-source-compact .domaine{font-family:var(--af-police-mono);font-size:9.5px;color:var(--af-sur-accent-2)}
/* vue publiée : le bouton occupe toute la hauteur du bandeau, plus grand,
   sans encart — deux zones (contenu / bouton), pas un bouton posé dedans */
.mode-publiee .btn-source-compact{width:240px;min-height:auto;align-items:center;justify-content:center;gap:5px;padding:16px 22px}
.mode-publiee .btn-source-compact .lib{font-size:16px}
.mode-publiee .btn-source-compact .lib .fleche{font-size:17px}
.mode-publiee .btn-source-compact .domaine{font-size:11px}

/* ---- carte « réseaux sociaux » (Lot 15, grille à plat au Lot 17) : rendu
   écran de la vue publiée, à la place de la ligne compacte renderEntree()
   — celle-ci reste générée en repli pour l'impression navigateur directe
   (Ctrl+P, voir @media print plus bas) ; le bouton « Imprimer ce numéro »
   de l'app, lui, ne passe jamais par ce HTML (jsPDF indépendant). Grille
   responsive (pas de media query : `auto-fit` choisit 1 colonne sur
   mobile, 2 voire 3 sur desktop selon la largeur réellement disponible),
   une seule pour tout le numéro depuis le Lot 17 (plus de blocs par
   rubrique — voir la pastille de rubrique sur chaque carte à la place). */
.mode-publiee .entree{display:none}
.carte-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:22px;padding:16px 22px 26px}
.carte-entree{background:var(--af-surface);border:1px solid var(--af-filet)}
.carte-lien-image{display:block;position:relative;text-decoration:none}
.carte-image{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.carte-legende{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(0deg,rgba(26,22,17,.82),rgba(26,22,17,0));padding:26px 16px 10px}
.carte-legende-texte{font-family:var(--af-police-mono);font-size:13px;font-weight:700;color:var(--af-sur-accent);display:flex;align-items:center;gap:6px}
.carte-legende-texte .fleche{font-size:14px}
.carte-legende .domaine{font-family:var(--af-police-mono);font-size:10px;color:var(--af-sur-accent-2)}
.carte-lien-texte{width:100%}
.carte-corps{padding:14px 18px 18px;display:flex;flex-direction:column;gap:7px}
.carte-titre{font-size:18px;font-weight:700;line-height:1.32;color:var(--af-accent)}
.carte-corps .flat-chiffres{white-space:normal;overflow:visible;text-overflow:clip;font-size:12px}
.carte-corps .flat-resume{font-size:13.5px;line-height:1.5}
@media print{
  .mode-publiee .entree{display:block !important}
  .carte-grille{display:none !important}
}

.entree-actions{display:flex;gap:6px}
.btn-mini{flex:1;font-family:var(--af-police-mono);font-size:10px;letter-spacing:.02em;text-transform:uppercase;text-align:center;padding:7px 6px;border:1px solid var(--af-redaction);color:var(--af-redaction);background:var(--af-surface)}
.btn-mini:hover{background:var(--af-redaction);color:var(--af-sur-redaction)}
.btn-mini.danger{border-color:var(--af-mort);color:var(--af-mort)}
.btn-mini.danger:hover{background:var(--af-mort);color:var(--af-sur-accent)}
.lien-action{font-family:var(--af-police-mono);font-size:10px;letter-spacing:.02em;color:var(--af-redaction);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.lien-action:hover{opacity:.75}
.lien-action.danger{color:var(--af-mort)}

/* ---- détails : toujours visibles, pas de repli ---- */
.entree-details{padding:2px 16px 18px 16px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.mode-redaction .entree-details{max-width:900px}

.usage{border:2px solid var(--af-prive);background:var(--af-surface);display:flex}
.usage-lisere{width:24px;flex:none;background-color:var(--af-prive-fond);background-image:repeating-linear-gradient(135deg, var(--af-prive-hachure) 0 3px, rgba(122,91,22,0) 3px 8px);border-right:1px solid var(--af-prive);display:flex;align-items:center;justify-content:center}
.usage-lisere span{font-family:var(--af-police-mono);font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--af-prive-texte);writing-mode:vertical-rl;transform:rotate(180deg)}
.usage-corps{padding:10px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.usage-titre{font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--af-prive)}
.usage-texte{margin:0;font-size:12px;line-height:1.5;color:var(--af-prive-texte-2)}

/* ---- édition en place (rédaction seule) ---- */
.mode-redaction [data-ed="true"]{background:var(--af-edit-fond);border-bottom:1px dotted var(--af-edit-pointille);padding:1px 5px;cursor:text}
.mode-redaction [data-ed="true"]:focus{outline:1px solid var(--af-redaction);box-shadow:0 0 0 3px rgba(138,95,23,.18);background:var(--af-surface)}

.case{width:15px;height:15px;flex:none;border:1.5px solid var(--af-encre-2);display:grid;place-items:center;font-size:11px;line-height:1;color:var(--af-sur-redaction);appearance:none;-webkit-appearance:none;background:var(--af-surface);margin:1px 0 0}
.case:checked{background:var(--af-redaction);border-color:var(--af-redaction)}
.case:checked::after{content:"✓"}
.case:disabled{cursor:not-allowed}
.case-bloc{border-color:var(--af-encre-3)}
.case-bloc:checked{background:var(--af-encre-3);border-color:var(--af-encre-3)}

.pied{padding:14px 22px;font-family:var(--af-police-mono);font-size:10px;line-height:1.6;color:var(--af-encre-3);border-top:1px solid var(--af-filet)}

/* ---- modal d'ajout / édition d'entrée (rédaction) ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(36,29,21,.6);display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;z-index:10}
.modal{width:100%;max-width:640px;background:var(--af-surface);border:2px solid var(--af-redaction);padding:20px 22px 16px;display:flex;flex-direction:column;gap:14px}
.modal-titre{font-family:var(--af-police-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-redaction)}
.modal form{display:flex;flex-direction:column;gap:12px}
.champs-ligne{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.champ{display:flex;flex-direction:column;gap:4px}
.champ label{font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-encre-3)}
.champ input,.champ textarea{font-family:var(--af-police);font-size:13px;padding:7px 9px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-courant)}
.champ textarea{resize:vertical;min-height:56px;font-family:var(--af-police-mono);font-size:11.5px;line-height:1.5}
.champ input:focus,.champ textarea:focus{outline:1px solid var(--af-redaction);box-shadow:0 0 0 3px rgba(138,95,23,.18)}
.champ .aide{font-size:9.5px;color:var(--af-encre-3);font-family:var(--af-police-mono)}
.illustration-ligne{display:flex;gap:8px;align-items:stretch}
.illustration-ligne input{flex:1;min-width:0}
.illustration-ligne .btn-ligne{flex:none;white-space:nowrap}
.illustration-apercu{width:120px;height:80px;object-fit:cover;border:1px solid var(--af-filet-fort);margin-top:2px}

.illustration-numero{display:flex;flex-direction:column;gap:5px}
.illustration-numero label{font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-encre-3)}
.illustration-numero .illustration-ligne{align-items:center}
.illustration-numero input{font-family:var(--af-police);font-size:13px;padding:7px 9px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-courant);min-width:260px}
.illustration-apercu-mini{flex:none;width:64px;height:48px;object-fit:cover;border:1px solid var(--af-filet-fort)}
.modal-boutons{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--af-filet)}
.modal-boutons-droite{display:flex;gap:10px;margin-left:auto}
.btn-texte{font-family:var(--af-police-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border:1px solid var(--af-filet-fort);color:var(--af-encre-2)}

/* ---- sommaire (lot 3) ---- */
.sommaire{padding:18px 22px 26px;display:flex;flex-direction:column}
/* Connexion (Lot 20, 02/09/2026) : discrète, alignée à droite, sous la
   dernière ligne du Sommaire — pas un bouton plein, pas dans le bandeau. */
.connexion-discrete{align-self:flex-end;margin-top:22px;font-family:var(--af-police-mono);font-size:10px;letter-spacing:.06em;color:var(--af-encre-3);padding:6px 4px}
.connexion-discrete:hover{color:var(--af-encre-2)}
.sommaire-mois{display:flex;align-items:center;gap:14px;padding:8px 2px;margin-top:20px}
.sommaire-mois:first-child{margin-top:0}
.sommaire-mois .nom{font-family:var(--af-police-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--af-encre)}
.sommaire-mois .filet,.groupe-titre .filet{flex:1;height:1px;background:var(--af-filet-fort)}
.sommaire-mois .compte{font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-encre-3);white-space:nowrap}
/* .deplier n'est pas scopé à .sommaire-mois : réutilisé tel quel par le
   groupe « les N autres » de l'écran Sources suivies (lot 4). */
.deplier{display:inline-flex;align-items:center;gap:6px;font-family:var(--af-police-mono);font-size:10.5px;font-weight:700;color:var(--af-accent);border:1px solid var(--af-accent);padding:4px 10px;white-space:nowrap}
.deplier:hover{background:var(--af-sur-accent-2)}
.deplier .chevron{font-size:9px}

/* .numero-carte est un <button> depuis le Lot 16 (toute la tuile ouvre le
   numéro, plus de bouton "Ouvrir le numéro" séparé) : reset des styles de
   bouton du navigateur (bordure, fond, police, alignement) en plus des
   styles propres à la tuile. */
.numero-carte{display:flex;align-items:stretch;border:1px solid var(--af-filet-moyen);background:var(--af-surface);margin-bottom:10px;padding:0;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.numero-carte:hover{border-color:var(--af-accent)}
.numero-carte.dernier{border-color:var(--af-accent)}
.nc-badge{flex:none;width:110px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:var(--af-accent);color:var(--af-sur-accent)}
.nc-badge .num{font-family:var(--af-police-mono);font-size:24px;font-weight:700;color:var(--af-sur-accent)}
.nc-badge .dernier-tag{align-self:flex-start;border:1px solid var(--af-sur-accent);color:var(--af-sur-accent);font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;margin-top:2px}
.nc-image{flex:none;width:220px;object-fit:cover;border-right:1px solid var(--af-filet-moyen)}
.nc-corps{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.nc-titre{font-size:16px;font-weight:700;color:var(--af-encre)}
.nc-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.nc-liste li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nc-titre-entree{font-size:12.5px;line-height:1.4;color:var(--af-encre-2)}
.nc-source-pastille{flex:none;font-family:var(--af-police-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--af-brun-rubrique);border:1px solid var(--af-filet-pastille);padding:0 5px;white-space:nowrap}
/* Mobile (Lot 16, retour d'usage : « simplement une suite de bandeau/carte
   avec n°+illustration cliquable ») : empilé plutôt que côte à côte
   (badge/image/corps ne tiendraient pas sur une largeur de téléphone), et
   la liste détaillée des actualités masquée — seul le titre du numéro
   reste, l'image et le numéro suffisent à se repérer avant d'ouvrir. */
@media (max-width:640px){
  .numero-carte{flex-direction:column;align-items:stretch}
  .nc-badge{width:auto;flex-direction:row;align-items:center;justify-content:space-between}
  .nc-image{width:100%;aspect-ratio:16/9;border-right:0;border-bottom:1px solid var(--af-filet-moyen)}
  .nc-liste{display:none}
}

.mois-replie{border:1px dashed var(--af-filet-fort);background:var(--af-surface-2);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--af-police-mono);font-size:11px;color:var(--af-encre-2)}
.mois-replie .chip{border:1px solid var(--af-filet-moyen);padding:4px 10px;background:var(--af-surface)}
.mois-replie .chip:hover{background:var(--af-accent);border-color:var(--af-accent);color:var(--af-sur-accent)}

/* ---- recherche transversale (lot 3) ---- */
.recherche-barre{padding:18px 22px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--af-filet)}
.recherche-label{display:block;font-family:var(--af-police-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--af-encre-3)}
.recherche-ligne{display:flex;gap:10px;flex-wrap:wrap}
.recherche-champ-texte{flex:1;min-width:220px;display:flex;border:1px solid var(--af-filet-fort);background:var(--af-surface)}
.recherche-champ-texte input{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:11px 12px;color:var(--af-encre-courant)}
.recherche-champ-texte input:focus{outline:none}
.recherche-champ-texte:focus-within{outline:2px solid var(--af-encre);outline-offset:-1px}
.recherche-champ-texte button{flex:none;background:var(--af-accent);color:var(--af-sur-accent);font-family:var(--af-police-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:0 18px}
.recherche-filtres{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.filtre-groupe{display:flex;flex-direction:column;gap:4px}
.filtre-groupe .lbl{font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--af-encre-3)}
.filtre-toggle{display:flex}
.filtre-toggle button{font-family:var(--af-police-mono);font-size:10.5px;padding:7px 11px;border:1px solid var(--af-filet-fort);color:var(--af-encre-2)}
.filtre-toggle button[aria-pressed="true"]{background:var(--af-encre);color:var(--af-sur-bandeau);border-color:var(--af-encre)}
.filtre-select{font:inherit;font-family:var(--af-police-mono);font-size:11px;padding:7px 8px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-courant)}
.recherche-compteur{padding:10px 22px;font-family:var(--af-police-mono);font-size:11px;color:var(--af-encre-3);border-bottom:1px solid var(--af-filet)}
.recherche-compteur strong{color:var(--af-encre);font-size:12px}
.recherche-corps{padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.recherche-vide{padding:26px 4px;font-size:13px;color:var(--af-encre-3)}
.resultats-tete{display:flex;align-items:center;gap:12px;font-family:var(--af-police-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--af-encre);margin:14px 0 8px}
.resultats-tete:first-child{margin-top:0}
.resultats-tete .filet{flex:1;height:1px;background:var(--af-filet-fort)}
.resultat-actu{border:1px solid var(--af-filet-moyen);background:var(--af-surface);display:flex;margin-bottom:10px}
.ra-corps{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ra-meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:11px;color:var(--af-encre-3);align-items:baseline}
.ra-meta .nom{font-weight:700;color:var(--af-encre)}
.ra-titre{font-size:15px;font-weight:700;color:var(--af-encre)}
.ra-extrait{font-size:12.5px;line-height:1.5;color:var(--af-encre-2)}
.ra-ou{font-size:10px;font-family:var(--af-police-mono);color:var(--af-encre-3)}
.ra-droite{flex:none;width:150px;padding:12px 16px;border-left:1px solid var(--af-filet);display:flex;flex-direction:column;gap:3px;font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-encre-3);text-align:right}
.ra-droite .parue{text-transform:uppercase;font-size:9px;letter-spacing:.08em}
.ra-droite .num{font-size:17px;font-weight:700;color:var(--af-accent);text-align:right}
.sources-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.resultat-source{border:1px solid var(--af-filet-moyen);display:flex;flex-direction:column;background:var(--af-surface)}
.rs-corps{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.rs-nature{font-family:var(--af-police-mono);font-size:9.5px;color:var(--af-encre-3);display:flex;justify-content:space-between}
.rs-titre{font-size:13px;font-weight:700;color:var(--af-encre)}
.rs-ouvrir{background:var(--af-accent);color:var(--af-sur-accent);font-family:var(--af-police-mono);font-size:11px;font-weight:700;text-decoration:none;padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
mark.surlignage{background:var(--af-surlignage-fond);color:var(--af-encre);padding:0 1px}

/* ---- sources suivies (lot 4, écran 5a) ---- */
.sources{padding-bottom:26px}
.sources-entete{background:var(--af-surface-2);border-bottom:1px solid var(--af-filet);padding:18px 22px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:22px}
.sources-entete-principal{display:flex;flex-direction:column;gap:6px}
.sources-entete-principal .label{font-family:var(--af-police-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--af-encre-3)}
.sources-entete-principal .total{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--af-encre-2)}
.sources-entete-principal .total b{font-family:var(--af-police-mono);font-size:26px;font-weight:700;color:var(--af-encre)}
.sources-collecte{display:flex;flex-direction:column;gap:4px}
.sources-collecte .label{font-family:var(--af-police-mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--af-encre-3)}
.sources-collecte .valeur{font-family:var(--af-police-mono);font-size:13px;color:var(--af-encre-2)}
.sources-collecte .valeur .echec{color:var(--af-mort);font-weight:700}
.sources-entete-actions{display:flex;gap:10px;margin-left:auto}
.sources-table{display:flex;flex-direction:column}
.sources-cols{display:grid;grid-template-columns:1fr 190px 190px 210px 130px;gap:14px;padding:9px 22px;border-bottom:1px solid var(--af-filet);font-family:var(--af-police-mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-encre-3)}
.groupe-titre{display:flex;align-items:center;gap:12px;padding:8px 22px;font-family:var(--af-police-mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-encre-2);background:var(--af-surface-2);border-bottom:1px solid var(--af-filet)}
.groupe-titre.echec{background:var(--af-sur-accent-2);color:var(--af-mort)}
.source-row{display:grid;grid-template-columns:1fr 190px 190px 210px 130px;gap:14px;padding:13px 22px;border-bottom:1px solid var(--af-filet);align-items:start}
.source-nom{display:flex;flex-direction:column;gap:2px;min-width:0}
.source-nom .nom{font-size:14px;font-weight:700;color:var(--af-encre)}
.source-nom .adresse{font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-encre-3);word-break:break-all}
.source-nom .echec-note{font-family:var(--af-police-mono);font-size:10.5px;color:var(--af-mort)}
.source-rubrique{font-size:12.5px;color:var(--af-encre-2)}
.source-moisson{font-family:var(--af-police-mono);font-size:11.5px;color:var(--af-encre-2)}
.source-moisson .echec{color:var(--af-mort);font-weight:700}
.source-rapporte{display:flex;flex-direction:column;gap:2px}
.source-rapporte .n{font-family:var(--af-police-mono);font-size:15px;font-weight:700;color:var(--af-encre)}
.source-rapporte .l{font-size:11px;color:var(--af-encre-2)}
.source-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.sources-replie{margin:10px 22px;border:1px dashed var(--af-filet-fort);background:var(--af-surface-2);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--af-encre-2)}
.sources-replie .chip{font-family:var(--af-police-mono);font-size:10px;color:var(--af-encre-3)}

.bilan-section{margin-top:22px}
.bilan-cols,.bilan-row{grid-template-columns:1fr 150px 220px}
.bilan-cols-2,.bilan-row-2{grid-template-columns:1fr 220px}
.bilan-mesure{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.bilan-barre{flex:1;height:6px;background:var(--af-surface-2);border:1px solid var(--af-filet)}
.bilan-barre-remplie{height:100%;background:var(--af-accent)}
.bilan-mesure .n{font-family:var(--af-police-mono);font-size:15px;font-weight:700;color:var(--af-encre);min-width:26px;text-align:right}

/* ---- moisson (lot 10 : liste intégrée à l'écran du numéro, plus de modale
   séparée — chaque candidat au même niveau de détail qu'une entrée retenue,
   voir renderCandidat()) ---- */
.moisson-section{border-top:3px solid var(--af-redaction)}
.moisson-entete{background:var(--af-redaction);color:var(--af-sur-redaction);padding:10px 20px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12.5px}
.moisson-entete .titre{font-family:var(--af-police-mono);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.moisson-candidat{background:var(--af-surface-2)}
.moisson-candidat .flat-titre{color:var(--af-redaction)}
.moisson-candidat.probleme{background:var(--af-sur-accent-2)}
.moisson-candidat .btn-mini{border-color:var(--af-redaction);color:var(--af-redaction)}
.moisson-candidat .btn-mini:hover{background:var(--af-redaction);color:var(--af-sur-redaction)}
.btn-source-compact.desactive{background:var(--af-surface-3);color:var(--af-encre-3)}
.ecart-panel{border-top:1px solid var(--af-filet-fort);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;background:var(--af-surface)}
.ecart-panel .lbl{font-family:var(--af-police-mono);font-size:9.5px;color:var(--af-encre-3);line-height:1.5}
.ecart-panel textarea{font:inherit;font-family:var(--af-police-mono);font-size:11.5px;padding:7px 9px;border:1px solid var(--af-filet-fort);min-height:52px;resize:vertical;background:var(--af-surface);color:var(--af-encre-courant)}
.ecart-panel .boutons{display:flex;gap:8px;justify-content:flex-end}
.deplacer-select-wrap{padding:8px 16px 12px;border-top:1px solid var(--af-filet)}
.deplacer-select-wrap .lbl{display:block;font-family:var(--af-police-mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-encre-3);margin-bottom:4px}
.deplacer-select-wrap select{font:inherit;font-family:var(--af-police-mono);font-size:11px;padding:6px 8px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-courant);width:100%}

/* ---- états limites (lot 4) ---- */
.etat-limite{padding:34px 30px 30px;display:flex;flex-direction:column;gap:14px;max-width:620px}
.etat-limite .glyphe{font-family:var(--af-police-mono);font-size:26px;line-height:1;color:var(--af-redaction)}
.mode-publiee .etat-limite .glyphe{color:var(--af-accent)}
.etat-limite.erreur .glyphe{color:var(--af-mort)}
.etat-limite.alerte .glyphe{color:var(--af-mort)}
.etat-limite h1,.etat-limite h2{font-size:21px;font-weight:700;color:var(--af-encre);line-height:1.25;margin:0}
.etat-limite p{font-size:13.5px;line-height:1.6;color:var(--af-encre-2);margin:0}
.etat-limite .detail-liste{border:1px solid var(--af-filet-fort);background:var(--af-surface);font-family:var(--af-police-mono);font-size:11.5px;line-height:1.7;padding:12px 14px;color:var(--af-encre-2);white-space:pre-line}
.etat-limite .puces{display:flex;flex-direction:column;gap:8px}
.etat-limite .puce{border:1px solid var(--af-filet-moyen);padding:8px 10px;font-size:12px}
.etat-limite .puce b{color:var(--af-encre)}
.etat-limite .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.etat-limite .rien-a-faire{border-top:1px solid var(--af-filet);padding-top:12px;font-family:var(--af-police-mono);font-size:11px;color:var(--af-encre-3)}
.etat-limite .filtre-rappel{font-family:var(--af-police-mono);font-size:11px;color:var(--af-encre-3);border-top:1px solid var(--af-filet);padding-top:12px}

/* ---- publication refusée (lot 4, état ⑥) ---- */
.refus-liste{display:flex;flex-direction:column;gap:10px}
.refus-item{border-left:3px solid var(--af-mort);background:var(--af-surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--af-encre-courant)}
.refus-item.vide{border-left-color:var(--af-prive)}
.refus-item b{color:var(--af-encre)}
.glyphe-alerte{font-family:var(--af-police-mono);font-size:22px;color:var(--af-mort);display:block}

/* ---- outils de développement (lot 4) : aperçu des états limites ---- */
.dev-outils{border-top:1px dashed var(--af-filet-fort);margin-top:8px;padding-top:8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-family:var(--af-police-mono);font-size:10px;color:var(--af-encre-3)}
.dev-outils .dev-label{font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--af-redaction)}
.dev-outils select{font:inherit;font-family:var(--af-police-mono);font-size:10px;padding:3px 6px;border:1px solid var(--af-filet-fort);background:var(--af-surface);color:var(--af-encre-courant)}
.dev-outils .lien-action{font-size:10px}

/* ---- impression (lot 4, écran 4c) : masqué à l'écran ---- */
.qr-impression{display:none}
.btn-imprimer{font-family:var(--af-police-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--af-encre-2);border:1px solid var(--af-filet-fort);padding:8px 13px}
.print-entete,.print-pied{display:none}

@media print{
  @page{size:A4;margin:12mm 14mm}
  body{background:var(--af-print-papier)}
  .page{padding:0;display:block}
  .app,.app.mode-redaction{max-width:none;border:0;background:var(--af-print-papier);color:var(--af-print-encre)}
  .app-liw,.bandeau,.mode-banniere,.numero-entete,.entete-actions,.entree-actions,.valide-case,.reorder-btns,.case-bloc,.etat-pastille,.dev-outils,.pied,.moisson-section,.ecart-panel,.deplacer-select-wrap,.btn-source-compact,.modal-overlay,.usage,.pastille-echelle,.flat-chiffres,.bloc-masque-texte{display:none !important}
  /* en-tête de page compacté (lot 4quater) : 2 lignes au lieu de 3 bandeaux */
  .print-entete{display:block;border-bottom:2px solid var(--af-print-encre);padding-bottom:6px;margin-bottom:10px}
  .print-ligne1{font-family:var(--af-police-mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--af-print-encre);opacity:.7;margin-bottom:3px}
  .print-ligne2{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .print-numero{display:flex;align-items:baseline;gap:10px;min-width:0}
  .print-numero .chiffre{font-family:var(--af-police-mono);font-size:15px;font-weight:700;white-space:nowrap}
  .print-titre{font-size:15px;font-weight:700;color:var(--af-print-encre);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .print-meta{font-family:var(--af-police-mono);font-size:9px;color:var(--af-print-encre);white-space:nowrap}
  .corps,.mode-publiee .corps{display:block}
  /* grille 2 colonnes, largeur fixe / hauteur libre (lot 4quater) */
  .colonne{column-count:2;column-gap:10mm}
  /* rubrique-tete + sa 1re entrée forment un bloc insécable (retour d'usage
     30/08/2026) : sans ça, la balance automatique des colonnes du navigateur
     peut laisser le titre de rubrique seul en bas d'une colonne pendant que
     sa carte part au sommet de la colonne suivante.
     Devenues MORTES depuis le Lot 17 (02/09/2026, plus de sections par
     rubrique à l'écran) : aucune entrée n'émet plus ce balisage. Laissées
     en l'état (rien ne les référence, aucun risque) — .entree{break-inside:
     avoid} plus bas suffit seul à empêcher la coupure d'une carte entre
     deux colonnes d'impression sur la liste à plat. */
  .rubrique-groupe-tete{break-inside:avoid}
  .rubrique-tete{background:none;border-top:2px solid var(--af-print-encre);border-bottom:1px solid var(--af-print-encre);padding:5px 0;margin-bottom:6px}
  .rubrique-tete .nom{color:var(--af-print-encre)}
  .rubrique-tete .filet{background:transparent}
  .rubrique-tete .position{display:none}
  /* cadre allégé (retour d'usage 30/08/2026) : un seul filet de séparation
     par carte au lieu d'un encart complet + un encart QR imbriqué dedans */
  .entree{border:0;border-bottom:1px solid var(--af-print-encre);padding:0 0 10px;margin:0 0 10px;break-inside:avoid}
  .entree-row-gauche{padding:0}
  .flat-titre{color:var(--af-print-encre);font-size:12.5px}
  .flat-meta{gap:5px}
  .flat-meta .nom,.meta-mono{color:var(--af-print-encre);border-color:var(--af-print-encre);font-size:9.5px}
  .flat-resume{color:var(--af-print-encre);font-size:10px;line-height:1.4;text-align:justify;text-indent:0;hyphens:auto;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .entree-details{padding:6px 0 0;max-width:none}
  .qr-impression{display:flex !important;gap:10px;align-items:center;border:0;border-top:1px solid var(--af-print-encre);padding:8px 0 0;margin-top:6px}
  .qr-impression svg{flex:none;width:80px;height:80px}
  .qr-impression .infos{display:flex;flex-direction:column;gap:3px;font-family:var(--af-police-mono);font-size:9px;color:var(--af-print-encre)}
  .qr-impression .infos .lbl{font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .print-pied{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:2px solid var(--af-print-encre);margin-top:14px;padding-top:8px;font-family:var(--af-police-mono);font-size:9px;color:var(--af-print-encre)}
  .print-pied .gauche{display:flex;align-items:center;gap:8px}
  .print-pied svg{width:28px;height:28px}
}

@media (max-width:640px){
  .page{padding:0 0 40px}
  .app,.app.mode-redaction{max-width:100%;border-left:0;border-right:0}
  .bandeau{padding:11px 14px}
  /* Barre d'onglets rédacteur (Sommaire/Rechercher/Sources/Bilan/
     Rédaction/Vue publiée, 6 boutons) : constaté le 02/09/2026, sans repli
     elle dépassait la largeur de l'écran (aucun des deux blocs .bandeau ne
     prévoyait de repli pour elle, contrairement au reste du bandeau qui
     wrap déjà). Faite défiler horizontalement plutôt que passer à la
     ligne : 6 pastilles sur plusieurs lignes aurait pris toute la hauteur
     de l'écran, un bandeau d'onglets qui défile est un motif mobile
     courant et reste compact. */
  .mode-toggle{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mode-toggle button{flex:none}
  .auth-statut{padding-left:0;flex-wrap:wrap;max-width:100%;row-gap:4px}
  .numero-entete{padding:14px 16px}
  .entete-titre{font-size:19px}
  .entete-actions{width:100%;align-items:stretch}
  .select-numero-wrap{justify-content:space-between}
  .select-numero{flex:1}
  .entete-boutons{justify-content:space-between}
  .entree-row{flex-wrap:wrap;row-gap:8px;align-items:flex-start}
  .entree-row-gauche{padding:9px 12px}
  .entree-row-droite{width:100%}
  /* Bug préexistant trouvé le 02/09/2026 en testant le Lot 20 (pas
     introduit par lui) : .entree-droite-colonne est flex:none (largeur de
     contenu) alors que .btn-source-compact réclame width:100% — sizing
     circulaire côté navigateur, qui retombe sur la largeur naturelle du
     contenu (bouton + Déplacer/Supprimer) et dépasse l'écran. En rédaction
     mobile spécifiquement (jamais vu en vue publiée, qui n'affiche pas
     .entree-actions). Corrigé : la colonne prend l'espace restant à côté
     de l'illustration (flex:1, min-width:0 empêche le contenu incompressible
     de forcer un débordement malgré tout). */
  .entree-droite-colonne{flex:1;min-width:0}
  .btn-source-compact,.mode-publiee .btn-source-compact{width:100%;min-height:44px;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px}
  .mode-publiee .btn-source-compact .lib{font-size:14px}
  .flat-titre{font-size:14.5px}
  /* Bouton "Modifier" redondant (Lot 20) : le titre ouvre déjà la même
     modale sur mobile (voir renderEntree()) — Déplacer/Supprimer restent. */
  .entree-actions [data-action="edit-entree"]{display:none}
  .entree-details,.mode-redaction .entree-details{padding:0 12px 16px 12px;max-width:none;display:flex;flex-direction:column}
  .modal{padding:16px 14px 14px}
  .sommaire,.recherche-barre,.recherche-compteur,.recherche-corps{padding-left:14px;padding-right:14px}
  /* Constaté le 02/09/2026 : sans repli, le nom du mois + le filet + le
     décompte + le bouton "Déplier" (tous en white-space:nowrap ou en
     largeur minimale incompressible) dépassaient la largeur de l'écran et
     forçaient TOUTE l'app en défilement horizontal sur mobile — un mois
     replié (avec bouton) suffisait à déclencher le bug, un mois ouvert
     (sans bouton, ex. le premier) ne le déclenchait pas. Le filet n'étant
     que décoratif, il cède la place en premier ; nom + décompte + bouton
     passent sur une seconde ligne au besoin. */
  .sommaire-mois{flex-wrap:wrap;row-gap:6px}
  .sommaire-mois .filet{display:none}
  .sommaire-mois .compte{margin-left:auto}
  .numero-carte{flex-direction:column}
  .nc-badge{flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--af-filet);width:auto}
  .nc-droite{flex-direction:row;align-items:center;border-left:0;border-top:1px solid var(--af-filet);width:auto}
  .resultat-actu{flex-direction:column}
  .ra-droite{flex-direction:row;flex-wrap:wrap;align-items:baseline;border-left:0;border-top:1px solid var(--af-filet);width:auto;text-align:left}
  .recherche-champ-texte{flex-direction:column}
  .recherche-champ-texte button{padding:11px}
  .sources-entete{padding:14px}
  .sources-entete-actions{margin-left:0;width:100%}
  .sources-entete-actions .btn-plein,.sources-entete-actions .btn-ligne{flex:1}
  .sources-cols{display:none}
  .source-row,.groupe-titre{padding-left:14px;padding-right:14px}
  .source-row{display:flex;flex-direction:column;gap:6px}
  .source-actions{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .etat-limite{padding:22px 16px}
}
</style>
</head>
<body>
<div class="page">
  <div id="app" class="app"></div>
</div>

<script src="./vendor/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script>
(function(){
  "use strict";

  var PICTO = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fdf8ec" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M3 6.5h10v14H3z"/><path d="M3 10h10"/><path d="M5.5 13.5h5M5.5 16.5h5"/><path d="M14.5 9 21 2.5"/><path d="M16 2.5h5v5"/></svg>';

  // ---- QR codes générés à la volée (lot 4, règle 6/29/CHANGELOG) ----
  // vendor/qrcode.js (Kazuhiko Arase, MIT) n'auto-détecte pas la taille :
  // on essaie les types du plus petit au plus grand jusqu'à ce que le texte
  // tienne (il jette « code length overflow » sinon).
  function makeQr(texte){
    for (var t = 1; t <= 40; t++) {
      try {
        var qr = qrcode(t, "M");
        qr.addData(String(texte || ""));
        qr.make();
        return qr;
      } catch (err) { /* essaie le type suivant, plus grand */ }
    }
    return null;
  }

  function qrSvg(texte, alt){
    var qr = makeQr(texte);
    return qr ? qr.createSvgTag({ cellSize: 3, margin: 4, alt: alt, scalable: true }) : "";
  }

  function dateImpression(){
    var d = new Date();
    function p2(n){ return (n < 10 ? "0" : "") + n; }
    return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear();
  }

  // ---- Impression : PDF généré au mm près (lot 4quater bis, 30/08/2026) ----
  // Le rendu CSS @media print (grille en colonnes du navigateur) restait
  // insatisfaisant (cadres, colonnes mal réparties, QR trop petits) malgré
  // deux passes de correction. Même choix qu'organisation-cours pour
  // l'ordre de mission (Lot C, commit 6257c18) : dessiner le document au
  // mm avec jsPDF plutôt que de compter sur le moteur d'impression du
  // navigateur. Les QR sont dessinés en vecteur (rectangles noirs par
  // module, via qr.isDark()/getModuleCount() de vendor/qrcode.js) plutôt
  // qu'en image bitmap — plus net, pas de conversion à faire.
  var PDF_PAGE_W = 210, PDF_PAGE_H = 297;
  var PDF_MARGE_X = 16, PDF_MARGE_HAUT = 16, PDF_MARGE_BAS = 26;
  var PDF_TITRE_SIZE = 12, PDF_TITRE_LH = 4.6;
  var PDF_META_LH = 3.6;
  var PDF_RESUME_SIZE = 9.5, PDF_RESUME_LH = 4.1;
  var PDF_QR_SIZE = 28;
  var PDF_TETE_H = 8.5;
  var PDF_ENTREE_GAP = 8; // entre le bloc texte (gauche) et le bloc source/QR (droite)
  var PDF_ENTREE_DROITE_W = 52; // largeur fixe du bloc droit (~1/3 de page)

  function pdfDessinerQr(doc, texte, x, y, taille){
    var qr = makeQr(texte);
    if (!qr) return;
    var n = qr.getModuleCount();
    var cell = taille / n;
    doc.setFillColor(0, 0, 0);
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) doc.rect(x + c * cell, y + r * cell, cell, cell, "F");
      }
    }
  }

  function pdfDessinerEntete(doc, numero, total){
    var y = PDF_MARGE_HAUT;
    doc.setFont("helvetica", "normal"); doc.setFontSize(7);
    doc.setTextColor(140, 130, 110);
    doc.text("Carnet de veille naturaliste · BTS Gestion et protection de la nature · Kerplouz", PDF_MARGE_X, y);
    y += 5.5;
    doc.setFont("helvetica", "bold"); doc.setFontSize(13);
    doc.setTextColor(0, 0, 0);
    var enteteMaxW = PDF_PAGE_W - 2 * PDF_MARGE_X;
    var enteteLignes = doc.splitTextToSize("N° " + numero.numero + "  " + numero.titre, enteteMaxW);
    var titreLigne = enteteLignes[0];
    if (enteteLignes.length > 1) {
      while (titreLigne.length > 1 && doc.getTextWidth(titreLigne + "…") > enteteMaxW) titreLigne = titreLigne.slice(0, -1).trim();
      titreLigne += "…";
    }
    doc.text(titreLigne, PDF_MARGE_X, y);
    y += 5;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.setTextColor(90, 80, 60);
    var meta = numero.semaine.replace(/^semaine /, "sem. ") + " · " + total + " actualité" + (total > 1 ? "s" : "") + " · imprimé le " + dateImpression();
    doc.text(meta, PDF_MARGE_X, y);
    y += 3;
    doc.setDrawColor(0); doc.setLineWidth(0.6);
    doc.line(PDF_MARGE_X, y, PDF_PAGE_W - PDF_MARGE_X, y);
    doc.setTextColor(0, 0, 0);
    return y + 6;
  }

  function pdfDessinerPied(doc, numero){
    // Reste dans la marge basse réservée (PDF_MARGE_BAS), loin du bord
    // physique — retour d'usage 30/08/2026 : le pied précédent, collé au
    // bord de la feuille, était illisible/coupé selon l'imprimante.
    var y = PDF_PAGE_H - PDF_MARGE_BAS + 6;
    doc.setDrawColor(0); doc.setLineWidth(0.4);
    doc.line(PDF_MARGE_X, y, PDF_PAGE_W - PDF_MARGE_X, y);
    y += 6;
    pdfDessinerQr(doc, location.href, PDF_MARGE_X, y - 4, 10);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
    doc.setTextColor(0, 0, 0);
    doc.text("Tous les numéros du carnet", PDF_MARGE_X + 13, y);
    doc.setTextColor(90, 80, 60);
    doc.text("portail.btsgpn-kerplouz.fr/carnet-de-veille", PDF_MARGE_X + 13, y + 3.6);
    doc.setTextColor(0, 0, 0);
    var droite = "Adresses vérifiées le " + (numero.collecte ? numero.collecte.date : dateImpression());
    var droiteW = doc.getTextWidth(droite);
    doc.text(droite, PDF_PAGE_W - PDF_MARGE_X - droiteW, y);
  }

  function pdfPreparerEntree(doc, e, colW){
    var gaucheW = colW - PDF_ENTREE_DROITE_W - PDF_ENTREE_GAP;
    doc.setFont("helvetica", "bold"); doc.setFontSize(PDF_TITRE_SIZE);
    var titreLignes = doc.splitTextToSize(e.titre, gaucheW).slice(0, 2);
    var resumeLignes = [], resumeClamped = false;
    if (e.blocs.resume && e.resume) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(PDF_RESUME_SIZE);
      var toutes = doc.splitTextToSize(e.resume, gaucheW);
      resumeClamped = toutes.length > 5;
      resumeLignes = toutes.slice(0, 5);
      if (resumeClamped) {
        var derniere = resumeLignes[4];
        while (derniere.length > 1 && doc.getTextWidth(derniere + "…") > gaucheW) derniere = derniere.slice(0, -1).trim();
        resumeLignes[4] = derniere + "…";
      }
    }
    var hauteurGauche = PDF_META_LH + 1 + titreLignes.length * PDF_TITRE_LH + 1.5 +
      (resumeLignes.length ? resumeLignes.length * PDF_RESUME_LH : 0);
    // bloc droit : QR centré, puis domaine + accroche en dessous
    var hauteurDroite = PDF_QR_SIZE + 4 + 3.6 + 3.6;
    var hauteur = Math.max(hauteurGauche, hauteurDroite) + 8; // + séparateur bas
    return { titreLignes: titreLignes, resumeLignes: resumeLignes, resumeClamped: resumeClamped, gaucheW: gaucheW, hauteur: hauteur };
  }

  function pdfDessinerRubriqueTete(doc, label, x, y, colW){
    // Un seul filet, sous le libellé (retour d'usage 30/08/2026 : trop de
    // lignes horizontales — le filet du haut faisait doublon avec le
    // séparateur de l'entrée précédente, juste au-dessus).
    y += 3;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    doc.setTextColor(138, 47, 57);
    doc.text(String(label).toUpperCase(), x, y);
    y += 1.5;
    doc.setDrawColor(0); doc.setLineWidth(0.3);
    doc.line(x, y, x + colW, y);
    doc.setTextColor(0, 0, 0);
    return y + 4;
  }

  function pdfDessinerEntree(doc, e, layout, x, y, colW){
    var xDroite = x + colW - PDF_ENTREE_DROITE_W;
    var yDepart = y;

    // ---- bloc gauche (2/3) : source, titre, résumé ----
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.setTextColor(90, 80, 60);
    doc.text(e.source.domaine + "  ·  " + e.source.date, x, y + 3);
    y += PDF_META_LH + 1;

    doc.setFont("helvetica", "bold"); doc.setFontSize(PDF_TITRE_SIZE);
    doc.setTextColor(0, 0, 0);
    layout.titreLignes.forEach(function(ligne){ y += PDF_TITRE_LH; doc.text(ligne, x, y); });
    y += 1.5;

    if (layout.resumeLignes.length) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(PDF_RESUME_SIZE);
      doc.setTextColor(40, 36, 28);
      layout.resumeLignes.forEach(function(ligne, i){
        y += PDF_RESUME_LH;
        var dernierNaturel = !layout.resumeClamped && i === layout.resumeLignes.length - 1;
        if (dernierNaturel) doc.text(ligne, x, y);
        else doc.text(ligne, x, y, { maxWidth: layout.gaucheW, align: "justify" });
      });
    }

    // ---- bloc droit (1/3) : QR + source, centré sur sa colonne ----
    var qrX = xDroite + (PDF_ENTREE_DROITE_W - PDF_QR_SIZE) / 2;
    pdfDessinerQr(doc, e.url || ("https://" + e.source.domaine), qrX, yDepart, PDF_QR_SIZE);
    var yTexteDroite = yDepart + PDF_QR_SIZE + 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.setTextColor(0, 0, 0);
    var domaineW = doc.getTextWidth(e.source.domaine);
    doc.text(e.source.domaine, xDroite + (PDF_ENTREE_DROITE_W - domaineW) / 2, yTexteDroite);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
    doc.setTextColor(90, 80, 60);
    var accroche = "Flasher pour ouvrir la source";
    var accrocheW = doc.getTextWidth(accroche);
    doc.text(accroche, xDroite + (PDF_ENTREE_DROITE_W - accrocheW) / 2, yTexteDroite + 3.6);
    doc.setTextColor(0, 0, 0);

    // Pas de filet sous l'entrée (retour d'usage 30/08/2026 : trop de
    // lignes horizontales) — l'espacement entre les cartes, déjà prévu
    // dans layout.hauteur, suffit à les distinguer.
    return yDepart + layout.hauteur;
  }

  function pdfBuildBlocks(doc, groupes, colW){
    var blocks = [];
    groupes.forEach(function(g){
      var premier = g.items[0];
      blocks.push({ type: "groupe", rubrique: g.rubrique, entree: premier, layout: pdfPreparerEntree(doc, premier, colW) });
      g.items.slice(1).forEach(function(e){
        blocks.push({ type: "entree", entree: e, layout: pdfPreparerEntree(doc, e, colW) });
      });
    });
    return blocks;
  }

  function numeroGenererPdfDoc(numeroCourant, visibles){
    var groupes = groupByRubrique(visibles);
    var total = visibles.length;
    var doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });
    var colW = PDF_PAGE_W - 2 * PDF_MARGE_X;
    var blocks = pdfBuildBlocks(doc, groupes, colW);
    var pageBas = PDF_PAGE_H - PDF_MARGE_BAS;
    var y = pdfDessinerEntete(doc, numeroCourant, total);

    blocks.forEach(function(block){
      var h = (block.type === "groupe" ? PDF_TETE_H : 0) + block.layout.hauteur;
      if (y + h > pageBas) {
        doc.addPage();
        y = pdfDessinerEntete(doc, numeroCourant, total);
      }
      if (block.type === "groupe") y = pdfDessinerRubriqueTete(doc, block.rubrique, PDF_MARGE_X, y, colW);
      y = pdfDessinerEntree(doc, block.entree, block.layout, PDF_MARGE_X, y, colW);
    });

    pdfDessinerPied(doc, numeroCourant);
    return doc;
  }

  function numeroImprimerDoc(doc){
    var url = URL.createObjectURL(doc.output("blob"));
    var iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = url;
    document.body.appendChild(iframe);
    iframe.onload = function(){
      setTimeout(function(){
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(function(){
          try { URL.revokeObjectURL(url); } catch (err) {}
          try { iframe.remove(); } catch (err) {}
        }, 30000);
      }, 1);
    };
  }

  // ---- « Nouveau numéro » (Lot 6) : champ Semaine en menu déroulant natif
  // (input type="week") plutôt qu'en rédaction libre — mois et libellé de
  // semaine sont calculés, jamais saisis à la main.
  var MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function isoSemaineActuelle(){
    var d = new Date();
    var jour = d.getDay() || 7;
    d.setDate(d.getDate() + 4 - jour); // jeudi de la semaine ISO courante
    var anneeIso = d.getFullYear();
    var jan1 = new Date(anneeIso, 0, 1);
    var semaine = Math.ceil((((d - jan1) / 86400000) + 1) / 7);
    return anneeIso + "-W" + (semaine < 10 ? "0" : "") + semaine;
  }

  function lundiSemaineIso(anneeIso, semaine){
    var jan4 = new Date(Date.UTC(anneeIso, 0, 4));
    var jourJan4 = jan4.getUTCDay() || 7; // lundi=1 .. dimanche=7
    var lundi = new Date(jan4);
    lundi.setUTCDate(jan4.getUTCDate() - jourJan4 + 1 + (semaine - 1) * 7);
    return lundi;
  }

  // "2026-W34" -> { mois: "août 2026", semaine: "semaine 34 · 17 → 23 août 2026" }
  function formaterSemaineIso(valeurWeek){
    var m = /^(\d{4})-W(\d{2})$/.exec(valeurWeek || "");
    if (!m) return null;
    var anneeIso = parseInt(m[1], 10), semaine = parseInt(m[2], 10);
    var lundi = lundiSemaineIso(anneeIso, semaine);
    var dimanche = new Date(lundi); dimanche.setUTCDate(lundi.getUTCDate() + 6);
    var moisLundi = MOIS_FR[lundi.getUTCMonth()], anneeLundi = lundi.getUTCFullYear();
    var moisDim = MOIS_FR[dimanche.getUTCMonth()], anneeDim = dimanche.getUTCFullYear();
    var plage = (moisLundi === moisDim && anneeLundi === anneeDim)
      ? lundi.getUTCDate() + " → " + dimanche.getUTCDate() + " " + moisDim + " " + anneeDim
      : lundi.getUTCDate() + " " + moisLundi + (anneeLundi !== anneeDim ? " " + anneeLundi : "") + " → " + dimanche.getUTCDate() + " " + moisDim + " " + anneeDim;
    return { mois: moisLundi + " " + anneeLundi, semaine: "semaine " + semaine + " · " + plage };
  }

  async function connexionOuCreation(email, motDePasse){
    var s = client();
    var tentative = await s.auth.signInWithPassword({ email: email, password: motDePasse });
    var session;
    if (tentative.error) {
      // Adresse inconnue (1re connexion) OU mot de passe incorrect : Supabase
      // renvoie la même erreur générique dans les deux cas (par sécurité), donc
      // on tente la création — cf. organisation-cours/js/auth.js.
      var inscription = await s.auth.signUp({ email: email, password: motDePasse });
      if (inscription.error) {
        if (/already|registered|exists/i.test(inscription.error.message || "")) {
          throw new Error("Ce mot de passe ne correspond pas à cette adresse. « Mot de passe oublié ? » pour le réinitialiser.");
        }
        throw inscription.error;
      }
      if (!inscription.data || !inscription.data.session) {
        throw new Error("Compte créé, mais la connexion immédiate est bloquée : « Confirm email » doit être désactivé côté Supabase.");
      }
      session = inscription.data.session;
    } else {
      session = tentative.data.session;
    }
    var redacteur;
    try {
      redacteur = await chargerRedacteur(session.user.id);
      if (!redacteur) redacteur = await creerRedacteur(session.user.id);
    } catch (e) {
      throw new Error("Adresse non autorisée à rédiger dans ce carnet — contacter l'enseignant responsable.");
    }
    return { user: session.user, redacteur: redacteur };
  }
