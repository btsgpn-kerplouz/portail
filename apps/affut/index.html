  // pratique [sur mobile] ») : à cette largeur, l'édition en place
  // (contenteditable) cède la place à la modale « Modifier » existante
  // (renderModal(), déjà tous les champs) — voir ed() et renderEntree().
  function mobileActif(){ return !!(window.matchMedia && window.matchMedia("(max-width:640px)").matches); }

  function numeroParDefaut(){
    var publies = numeros.filter(function(n){ return n.statut !== "brouillon"; });
    var base = publies.length ? publies : numeros;
    return base.reduce(function(m, n){ return n.numero > m ? n.numero : m; }, 0);
  }

  function currentNumero(){
    return numeros.filter(function(n){ return n.numero === state.numeroId; })[0] || numeros[0];
  }
  function bindCurrent(){ numero = currentNumero(); entrees = numero ? numero.entrees : []; }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // role="textbox" (lot 5, audit RGAA) : un <span contenteditable> n'a par
  // défaut aucune sémantique de champ de saisie pour un lecteur d'écran.
  function ed(html, path){ return (state.mode === "redaction" && !mobileActif()) ? '<span data-ed="true" data-path="' + path + '" contenteditable="true" role="textbox">' + html + '</span>' : html; }

  function setEdValue(path, value){
    var parts = path.split(".");
    if (parts[0] === "numero") { numero[parts[1]] = value; return; }
    var entree = entrees.filter(function(e){ return e.id === parts[0]; })[0];
    if (!entree) return;
    if (parts[1] === "source") entree.source[parts[2]] = value;
    else if (parts[1] === "chiffres") entree.chiffres[parseInt(parts[2], 10)][parts[3]] = value;
    else entree[parts[1]] = value;
  }

  // esc(c.v) + " " + esc(c.l) sans le v (cas des chiffres repris d'un
  // candidat de moisson, voir chiffresCandidatVersBlocs) laisserait une
  // espace insécable en tête du texte affiché.
  // `path` (Lot 12) : préfixe "eid.chiffres.i" pour rendre valeur et libellé
  // éditables en place chacun séparément, plutôt qu'un bloc texte unique —
  // ajout/suppression/accent restent du ressort du formulaire modal.
  function chiffreTexte(c, path){
    var vTxt = path ? ed(esc(c.v), path + ".v") : esc(c.v);
    var lTxt = path ? ed(esc(c.l), path + ".l") : esc(c.l);
    var v = c.v || path ? vTxt + " " : "";
    return c.accent ? "<b>" + v + "</b>" + lTxt : v + lTxt;
  }

  // Un candidat de moisson (Edge Function affut-veille) porte ses chiffres
  // en chaînes brutes au format "valeur | libellé" (voir la consigne
  // donnée à l'agent, documents/brief-veille.md) — même convention que le
  // textarea du formulaire d'entrée (parseChiffreLigne ci-dessous), donc
  // réutilisée telle quelle au moment de retenir un candidat comme entrée.
  // Bug corrigé le 01/09/2026 : la 1re version empaquetait la chaîne
  // entière dans `l` sans la découper — en plus d'un antique "undefined"
  // (le tout premier bug, .v/.l lus sur une chaîne brute jamais convertie),
  // ça produisait des lignes bien plus longues que prévu ("108 | ours
  // détectés…" affiché tel quel), qui débordaient de l'écran une fois
  // enregistrées.
  function chiffresCandidatVersBlocs(chiffres){
    return (chiffres || []).map(function(s){ return parseChiffreLigne(String(s || "").trim()); });
  }

  function flatChiffres(e){
    if (!e.chiffres.length) return "";
    if (state.mode !== "redaction") {
      if (!e.blocs.chiffres) return "";
      var txtPub = e.chiffres.map(chiffreTexte).join(" · ");
      return '<div class="flat-chiffres tab-num">' + txtPub + '</div>';
    }
    var checkbox = '<input type="checkbox" class="case case-bloc" ' + (e.blocs.chiffres ? "checked" : "") + ' data-action="toggle-bloc" data-id="' + e.id + '" data-bloc="chiffres" title="Afficher les chiffres clés">';
    var contenu;
    if (e.blocs.chiffres) {
      var txt = e.chiffres.map(function(c, i){ return chiffreTexte(c, e.id + ".chiffres." + i); }).join(" · ");
      contenu = '<div class="flat-chiffres tab-num">' + txt + '</div>';
    } else {
      var vals = e.chiffres.map(function(c){ return c.v; }).join(" · ");
      contenu = '<span class="bloc-masque-texte">Chiffres clés masqués — conservés : ' + esc(vals) + '</span>';
    }
    return '<div class="bloc-ligne">' + checkbox + contenu + '</div>';
  }

  function flatResume(e){
    if (state.mode !== "redaction") {
      return e.blocs.resume ? '<div class="flat-resume">' + esc(e.resume) + '</div>' : "";
    }
    var checkbox = '<input type="checkbox" class="case case-bloc" ' + (e.blocs.resume ? "checked" : "") + ' data-action="toggle-bloc" data-id="' + e.id + '" data-bloc="resume" title="Afficher le résumé">';
    var contenu = e.blocs.resume
      ? '<div class="flat-resume">' + ed(esc(e.resume), e.id + ".resume") + '</div>'
      : '<span class="bloc-masque-texte">Résumé masqué</span>';
    return '<div class="bloc-ligne">' + checkbox + contenu + '</div>';
  }

  function renderUsage(e){
    if (!e.usage || state.mode !== "redaction") return ""; // jamais publié : absent du rendu, pas seulement caché
    return '<div class="usage"><div class="usage-lisere"><span>Privé</span></div><div class="usage-corps"><div class="usage-titre">Usage en cours — jamais publié</div><p class="usage-texte">' + ed(esc(e.usage), e.id + ".usage") + '</p></div></div>';
  }

  function renderEntree(e, estPremier, estDernier){
    var redac = state.mode === "redaction";
    var btn = '<a class="btn-source-compact" href="' + esc(e.url || ("#" + e.id)) + '"' + (redac ? "" : ' data-action="clic-source" data-id="' + e.id + '"') + '><span class="lib">Ouvrir la source<span class="fleche">→</span></span><span class="domaine">' + esc(e.source.domaine) + '</span></a>';
    var actions = redac
      ? '<div class="entree-actions"><button type="button" class="btn-mini" data-action="edit-entree" data-id="' + e.id + '">Modifier</button><button type="button" class="btn-mini" data-action="toggle-deplacer" data-id="' + e.id + '">Déplacer</button><button type="button" class="btn-mini danger" data-action="ecarter-entree" data-id="' + e.id + '">Supprimer</button></div>'
      : "";
    // Ordre d'affichage du numéro (Lot 10bis, à plat sur tout le numéro
    // depuis le Lot 17) : boutons compacts Monter/Descendre, désactivés en
    // butée de liste plutôt que masqués (repère visuel stable, pas de saut
    // de mise en page).
    var reorder = redac
      ? '<div class="reorder-btns"><button type="button" class="btn-reorder" data-action="monter-entree" data-id="' + e.id + '" title="Monter"' + (estPremier ? " disabled" : "") + '>▲</button><button type="button" class="btn-reorder" data-action="descendre-entree" data-id="' + e.id + '" title="Descendre"' + (estDernier ? " disabled" : "") + '>▼</button></div>'
      : "";

    var row =
      '<div class="entree-row">' +
        '<div class="entree-row-gauche">' +
          reorder +
          (redac ? '<input type="checkbox" class="case valide-case" ' + (e.valide ? "checked" : "") + ' data-action="toggle-valide" data-id="' + e.id + '" title="Entrée retenue">' : "") +
          '<div class="flat">' +
            '<div class="flat-meta">' +
              '<span class="pastille-rubrique">' + esc(e.rubrique) + '</span>' +
              '<span class="nom">' + ed(esc(e.source.nom), e.id + ".source.nom") + '</span>' +
              (e.source.territoire ? '<span class="pastille-echelle">' + esc(e.source.territoire) + '</span>' : "") +
              '<span class="meta-mono">' + esc(e.source.domaine) + ' · ' + ed(esc(e.source.date), e.id + ".source.date") + '</span>' +
              (redac ? '<span class="etat-pastille' + (e.valide ? " ok" : "") + '">' + (e.valide ? "✓ validée" : "en attente") + ' · ◇ ' + e.origine + '</span>' : "") +
              (redac && e.lienMort ? '<span class="etat-pastille mort">✕ lien mort depuis le ' + esc(e.lienMortDepuis) + '</span>' : "") +
              (redac && !e.lienMort && (!e.url || !e.url.trim()) ? '<span class="etat-pastille mort">✕ bloc source vide</span>' : "") +
            '</div>' +
            // Sur mobile en rédaction (Lot 20), le titre ouvre directement
            // la modale « Modifier » (tous les champs) au lieu de l'édition
            // en place : au doigt, un <span contenteditable> minuscule au
            // milieu d'une ligne dense est peu praticable, et avoir les deux
            // façons d'éditer en même temps prêtait à confusion.
            (redac && mobileActif()
              ? '<button type="button" class="flat-titre flat-titre-bouton" data-action="edit-entree" data-id="' + e.id + '">' + esc(e.titre) + '<span class="flat-titre-chevron">›</span></button>'
              : '<div class="flat-titre">' + ed(esc(e.titre), e.id + ".titre") + '</div>') +
            flatChiffres(e) +
            flatResume(e) +
          '</div>' +
        '</div>' +
        '<div class="entree-row-droite">' +
          (e.imageUrl ? '<img class="entree-image" src="' + esc(e.imageUrl) + '" alt="" loading="lazy">' : "") +
          '<div class="entree-droite-colonne">' + btn + actions + '</div>' +
        '</div>' +
      '</div>';

    var qrImpression = '<div class="qr-impression">' + qrSvg(e.url || ("https://" + e.source.domaine), "Ouvrir " + esc(e.source.domaine)) +
      '<div class="infos"><span class="lbl">La source</span><span>' + esc(e.source.domaine) + ' · flasher le code pour ouvrir</span></div></div>';

    var detailsInner =
      qrImpression +
      renderUsage(e) +
      (redac && state.deplacerOuvert === e.id ? renderDeplacerPanel(e) : "") +
      (redac && state.ecarterEntreeOuvert === e.id ? renderEcartEntreePanel(e) : "");

    var details = '<div class="entree-details">' + detailsInner + '</div>';

    return '<div class="entree" data-entree="' + e.id + '">' + row + details + '</div>';
  }

  // Carte « format réseaux sociaux » (Lot 15, 02/09/2026) : rendu ALTERNATIF
  // d'une entrée, réservé à la vue publiée sur écran — l'image, quand il y
  // en a une, devient elle-même le lien vers la source (plus grande que ce
  // que la ligne compacte de renderEntree() permet), à la place du bouton
  // « Ouvrir la source ». N'existe qu'à côté de renderEntree(), jamais à sa
  // place : l'impression continue d'utiliser le rendu compact existant
  // (Lot 4quater, mise en page 2 colonnes déjà réglée) — cette carte est
  // seulement affichée à l'écran et masquée à l'impression (voir
  // `@media print{.carte-entree{display:none}}`), et renderEntree() reste,
  // lui, masqué à l'écran en vue publiée mais toujours généré et affiché à
  // l'impression (`.mode-publiee .entree{display:none}`, réaffiché en
  // print). D'où les deux rendus émis côte à côte pour chaque entrée
  // publiée (voir renderNumeroPage()) plutôt qu'un remplacement.
  function renderEntreeCarte(e){
    // Légende toujours visible (jamais l'image seule comme lien) : nom de
    // l'accessible du lien pour les lecteurs d'écran, et repère visuel
    // explicite que l'image mène quelque part — même dans un format
    // « réseaux sociaux », personne ne devine qu'une photo est cliquable
    // sans indice.
    var texteOuvrir = 'Ouvrir la source<span class="fleche">→</span>';
    var domaineSpan = '<span class="domaine">' + esc(e.source.domaine) + '</span>';
    var lien = e.imageUrl
      ? '<a class="carte-lien-image" href="' + esc(e.url || ("#" + e.id)) + '" data-action="clic-source" data-id="' + e.id + '">' +
          '<img class="carte-image" src="' + esc(e.imageUrl) + '" alt="" loading="lazy">' +
          '<span class="carte-legende"><span class="carte-legende-texte">' + texteOuvrir + '</span>' + domaineSpan + '</span>' +
        '</a>'
      : '<a class="btn-source-compact carte-lien-texte" href="' + esc(e.url || ("#" + e.id)) + '" data-action="clic-source" data-id="' + e.id + '"><span class="lib">' + texteOuvrir + '</span>' + domaineSpan + '</a>';

    return '<div class="carte-entree">' +
      lien +
      '<div class="carte-corps">' +
        '<div class="flat-meta">' +
          '<span class="pastille-rubrique">' + esc(e.rubrique) + '</span>' +
          '<span class="nom">' + esc(e.source.nom) + '</span>' +
          (e.source.territoire ? '<span class="pastille-echelle">' + esc(e.source.territoire) + '</span>' : "") +
          '<span class="meta-mono">' + esc(e.source.domaine) + ' · ' + esc(e.source.date) + '</span>' +
        '</div>' +
        '<div class="carte-titre">' + esc(e.titre) + '</div>' +
        flatChiffres(e) +
        flatResume(e) +
      '</div>' +
    '</div>';
  }

  // Déplacement d'une entrée retenue vers un autre numéro (Lot 10) : simple
  // <select> natif, même principe que renderSelecteurNumero() ; « + Nouveau
  // numéro » ouvre le formulaire de création existant et termine le
  // déplacement une fois le numéro créé (voir le submit de #numero-form).
  function renderDeplacerPanel(e){
    var autres = numeros.filter(function(n){ return n.numero !== numero.numero; }).sort(function(a, b){ return b.numero - a.numero; });
    var options = '<option value="">Déplacer vers…</option>' +
      autres.map(function(n){
        var sem = n.semaine.match(/^semaine (\d+)/);
        var label = "n° " + n.numero + (n.statut === "brouillon" ? " · brouillon" : (sem ? " · sem. " + sem[1] : " · publié"));
        return '<option value="' + n.numero + '">' + esc(label) + '</option>';
      }).join("") +
      '<option value="__nouveau__">+ Nouveau numéro (n° ' + prochainNumero() + ')</option>';
    return '<div class="deplacer-select-wrap"><label class="lbl" for="deplacer-' + e.id + '">Déplacer cette entrée vers un autre numéro</label>' +
      '<select id="deplacer-' + e.id + '" data-action="deplacer-select" data-id="' + e.id + '">' + options + '</select></div>';
  }

  // Supprimer une entrée retenue avec motif (Lot 11) : même geste et même
  // panneau que « écarter avec motif » sur un candidat de moisson
  // (renderCandidat), pour qu'une entrée retirée APRÈS avoir été retenue —
  // y compris après une dépublication — nourrisse elle aussi la boucle de
  // retour de l'agent de veille (creerCandidatEcarte réutilise
  // affut_candidats_ecartes, l'entrée a déjà exactement la forme attendue :
  // id/rubrique/source/url/titre). Disponible à tout moment en rédaction,
  // quel que soit numero.statut (brouillon ou publié).
  function renderEcartEntreePanel(e){
    return '<div class="ecart-panel">' +
      '<label class="lbl" for="motif-ecart-entree-' + e.id + '">Motif de la suppression (facultatif — lu par la routine de veille automatisée, jamais par les élèves)</label>' +
      '<textarea id="motif-ecart-entree-' + e.id + '" data-role="motif-ecart-entree"></textarea>' +
      '<div class="boutons"><button type="button" class="btn-texte" data-action="annuler-ecart-entree">Annuler</button><button type="button" class="btn-mini danger" data-action="confirmer-suppression-entree" data-id="' + e.id + '">Supprimer définitivement</button></div>' +
    '</div>';
  }

  // Ordre des rubriques (blocs) inchangé : 1re apparition dans `list`, comme
  // avant le Lot 10bis. Toujours utilisée par l'export PDF
  // (numeroGenererPdfDoc()/pdfBuildBlocks(), dessiné indépendamment via
  // jsPDF — jamais lu depuis le DOM/CSS) qui continue de grouper par
  // rubrique dans le document exporté. **Plus utilisée pour l'affichage
  // écran depuis le Lot 17** (02/09/2026, retour d'usage : « on n'est plus
  // obligé d'afficher les entrées par blocs de rubriques ») — voir
  // entreesOrdonnees() plus bas et la rubrique en pastille sur chaque
  // entrée (renderEntree()/renderEntreeCarte()) à la place des sections.
  // Comparateur partagé par groupByRubrique(), entreesOrdonnees() et la
  // tuile Sommaire (renderNumeroCarte()) — un seul et même ordre manuel
  // (Monter/Descendre en rédaction) affiché partout où des entrées d'un
  // numéro apparaissent, plutôt que l'ordre de lecture réseau (non garanti).
  function parOrdre(a, b){ return (a.ordre || 0) - (b.ordre || 0); }

  function groupByRubrique(list){
    var order = [], map = {};
    list.forEach(function(e){
      if (!map[e.rubrique]) { map[e.rubrique] = []; order.push(e.rubrique); }
      map[e.rubrique].push(e);
    });
    return order.map(function(r){
      var items = map[r].slice().sort(parOrdre);
      return { rubrique: r, items: items };
    });
  }

  // Liste à PLAT de toutes les entrées du numéro, dans l'ordre d'affichage
  // (Lot 17, 02/09/2026 — remplace l'ordre par rubrique du Lot 10bis, plus
  // de blocs à l'écran). Tri direct par `ordre` — PAS via groupByRubrique()
  // (correctif du 02/09/2026 : passer par groupByRubrique() groupait
  // d'abord par rubrique puis triait seulement à l'intérieur de chaque
  // groupe, donc Monter/Descendre ne pouvait jamais faire franchir à une
  // entrée sa frontière de rubrique à l'écran, malgré un `ordre` à jour en
  // base — retour d'usage : « je ne peux pas vraiment ordonner les entrées
  // ... seulement au sein d'une rubrique »). Suppose que `ordre` est unique
  // à plat sur tout le numéro : voir supabase/009-ordre-entrees-plat.sql,
  // la migration de bascule qui renumérote les entrées déjà en base (avant
  // elle, `ordre` était attribué PAR RUBRIQUE depuis le Lot 10bis, deux
  // rubriques pouvant partager les mêmes valeurs 0,1,2…).
  function entreesOrdonnees(){
    return entrees.slice().sort(parOrdre);
  }

  // Prochaine valeur d'`ordre` libre pour une nouvelle entrée (nouvelle
  // entrée manuelle, ou candidat retenu de la moisson) : ajoutée en fin de
  // la liste à plat du numéro.
  function prochainOrdre(){
    return entrees.reduce(function(m, x){ return Math.max(m, (x.ordre || 0) + 1); }, 0);
  }

  // Déplace une entrée d'un cran (sens -1 = monter, +1 = descendre) dans la
  // liste à plat du numéro entier (Lot 17 — auparavant au sein d'une seule
  // rubrique, Lot 10bis) : réassigne 0..n-1 à TOUTES les entrées du numéro
  // plutôt que d'échanger deux valeurs — évite tout cas particulier avec
  // des `ordre` par défaut à 0 ou déjà égaux.
  function deplacerOrdreEntree(id, sens){
    var e = entrees.filter(function(x){ return x.id === id; })[0];
    if (!e) return;
    var voisins = entreesOrdonnees();
    var idx = voisins.indexOf(e);
    var idxCible = idx + sens;
    if (idxCible < 0 || idxCible >= voisins.length) return;
    voisins.splice(idx, 1);
    voisins.splice(idxCible, 0, e);
    voisins.forEach(function(x, i){
      if (x.ordre !== i) { x.ordre = i; ecrireEntree(x.id, { ordre: i }); }
    });
    render();
  }

  // Une ligne "valeur | libellé" (le "*" final marque l'accent) -> {v,l[,accent]}.
  // Partagée entre le textarea de saisie manuelle (parseChiffres) et les
  // chiffres bruts d'un candidat de moisson (chiffresCandidatVersBlocs) —
  // même convention des deux côtés.
  function parseChiffreLigne(line){
    var idx = line.indexOf("|");
    if (idx === -1) return { v: line, l: "" };
    var v = line.slice(0, idx).trim();
    var l = line.slice(idx + 1).trim();
    var accent = /\*$/.test(l);
    if (accent) l = l.replace(/\*$/, "").trim();
    return accent ? { v: v, l: l, accent: true } : { v: v, l: l };
  }

  function parseChiffres(text){
    return String(text || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(parseChiffreLigne);
  }

  function chiffresToText(chiffres){
    return (chiffres || []).map(function(c){ return c.v + " | " + c.l + (c.accent ? " *" : ""); }).join("\n");
  }

  function champ(label, name, value, aide, isTextarea){
    var tag = isTextarea
      ? '<textarea id="champ-' + name + '" name="' + name + '">' + esc(value || "") + '</textarea>'
      : '<input id="champ-' + name + '" name="' + name + '" type="text" value="' + esc(value || "") + '">';
    return '<div class="champ"><label for="champ-' + name + '">' + label + '</label>' + tag + (aide ? '<span class="aide">' + aide + '</span>' : "") + '</div>';
  }

  // Illustration d'une entrée (Lot 14) : un simple champ URL, remplissable
  // à la main ou via le bouton « Récupérer l'illustration » (og:image de la
  // page source, voir recupererIllustration() et la fonction Edge
  // affut-illustration) — même champ quelle que soit son origine, le front
  // ne distingue jamais les deux. Bouton + aperçu manipulés en DOM direct
  // (voir l'écouteur data-action="recuperer-illustration"), jamais via
  // render() : le formulaire n'est pas contrôlé (lu seulement à la
  // soumission), un render() en cours de saisie effacerait toute frappe non
  // enregistrée dans les autres champs (titre, résumé, chiffres...).
  function renderChampIllustration(value){
    var v = value || "";
    return '<div class="champ champ-illustration">' +
      '<label for="champ-imageUrl">Illustration (adresse d\'image, facultative)</label>' +
      '<div class="illustration-ligne">' +
        '<input id="champ-imageUrl" name="imageUrl" type="text" value="' + esc(v) + '">' +
        '<button type="button" class="btn-ligne" data-action="recuperer-illustration">Récupérer l\'illustration</button>' +
      '</div>' +
      '<span class="aide" data-role="illustration-statut"></span>' +
      '<img class="illustration-apercu"' + (v ? "" : ' hidden') + ' src="' + esc(v) + '" alt="">' +
    '</div>';
  }

  // Illustration DU NUMÉRO (Lot 16) — distincte de celle d'une entrée :
  // pilote uniquement la tuile Sommaire, jamais déduite automatiquement
  // (voir renderNumeroCarte()). Champ manuel seulement, pas de bouton
  // « Récupérer » : il n'y a pas de page unique associée à un numéro dont
  // extraire une og:image, contrairement à une entrée qui a sa propre
  // source. Pour reprendre l'image d'une entrée déjà illustrée, la copier
  // depuis son propre champ (formulaire de l'entrée) et la coller ici.
  function renderChampIllustrationNumero(){
    var v = numero.imageUrl || "";
    return '<div class="illustration-numero">' +
      '<label for="champ-image-numero">Illustration du numéro (tuile Sommaire, facultative)</label>' +
      '<div class="illustration-ligne">' +
        '<input id="champ-image-numero" type="text" value="' + esc(v) + '" placeholder="Coller une adresse d\'image…">' +
        (v ? '<img class="illustration-apercu-mini" src="' + esc(v) + '" alt="">' : "") +
      '</div>' +
    '</div>';
  }

  // Appel partagé à la fonction Edge (utilisé par le bouton individuel du
  // formulaire et par le traitement en masse ci-dessous) : renvoie
  // l'adresse d'image trouvée (ou null si aucune), lève une erreur au
  // message déjà nettoyé sinon.
  async function appellerFonctionIllustration(pageUrl){
    // functions.invoke() n'attache pas toujours de façon fiable le jeton
    // de la session en cours (constaté le 02/09/2026 : la fonction
    // recevait la clé publique au lieu du jeton du rédacteur connecté,
    // d'où un "Non authentifié" malgré une session active) — on le
    // fournit nous-mêmes, explicitement.
    var session = (await client().auth.getSession()).data.session;
    var options = { body: { url: pageUrl } };
    if (session) options.headers = { Authorization: "Bearer " + session.access_token };
    var res = await client().functions.invoke("affut-illustration", options);
    if (res.error) {
      // supabase-js ne met que "Edge Function returned a non-2xx status
      // code" dans err.message — le vrai détail ({error: "..."} renvoyé
      // par affut-illustration) est dans err.context (la Response brute).
      var detail = res.error.message || String(res.error);
      if (res.error.context && typeof res.error.context.json === "function") {
        try { var corps = await res.error.context.json(); if (corps && corps.error) detail = corps.error; } catch (e2) { /* corps non JSON, on garde le message d'origine */ }
      }
      throw new Error(detail);
    }
    return (res.data && res.data.image_url) || null;
  }

  async function recupererIllustration(btn){
    var form = btn.closest("form");
    var urlField = form.elements["url"];
    var pageUrl = urlField ? urlField.value.trim() : "";
    var statutEl = form.querySelector('[data-role="illustration-statut"]');
    var imgField = form.elements["imageUrl"];
    var apercuEl = form.querySelector(".illustration-apercu");
    if (!pageUrl) { if (statutEl) statutEl.textContent = "Renseignez d'abord l'adresse de la source."; return; }

    btn.disabled = true;
    if (statutEl) statutEl.textContent = "Recherche de l'illustration…";
    try {
      var image = await appellerFonctionIllustration(pageUrl);
      if (image) {
        imgField.value = image;
        apercuEl.src = image;
        apercuEl.hidden = false;
        if (statutEl) statutEl.textContent = "Illustration trouvée.";
      } else if (statutEl) {
        statutEl.textContent = "Aucune illustration trouvée sur cette page — vous pouvez en coller une manuellement.";
      }
    } catch (err) {
      if (statutEl) statutEl.textContent = "Échec de la récupération : " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  // Traitement en masse (demandé le 02/09/2026, en plus du bouton
  // individuel plutôt qu'à sa place — celui-ci reste utile pour changer
  // une adresse au cas par cas) : parcourt les entrées du numéro affiché
  // sans illustration et sans lien mort, appelle la fonction Edge pour
  // chacune, séquentiellement (pas en parallèle — évite de bombarder la
  // fonction et reste lisible dans le texte du bouton pendant le
  // traitement). Une entrée en échec n'interrompt pas les suivantes.
  async function recupererIllustrationsManquantes(btn){
    var cibles = entrees.filter(function(e){ return !e.imageUrl && e.url && e.url.trim() && !/^#/.test(e.url) && !e.lienMort; });
    if (!cibles.length) { window.alert("Aucune entrée sans illustration à traiter dans ce numéro."); return; }

    btn.disabled = true;
    var texteInitial = btn.textContent;
    var trouvees = 0, echecs = 0;
    for (var i = 0; i < cibles.length; i++){
      var e = cibles[i];
      btn.textContent = "Récupération des illustrations… (" + (i + 1) + "/" + cibles.length + ")";
      try {
        var image = await appellerFonctionIllustration(e.url);
        if (image) { e.imageUrl = image; ecrireEntree(e.id, { imageUrl: image }); trouvees++; }
      } catch (err) {
        echecs++;
      }
    }
    btn.textContent = texteInitial;
    btn.disabled = false;
    render();
    window.alert(
      trouvees + " illustration" + (trouvees > 1 ? "s trouvées" : " trouvée") +
      " sur " + cibles.length + " entrée" + (cibles.length > 1 ? "s" : "") + " sans illustration" +
      (echecs ? " (" + echecs + " échec" + (echecs > 1 ? "s" : "") + ")" : "") + "."
    );
  }

  function renderModal(){
    if (!state.modal) return "";
    var editing = state.modal.mode === "edit";
    var e = editing ? entrees.filter(function(x){ return x.id === state.modal.id; })[0] : null;
    if (editing && !e) return "";

    return '<div class="modal-overlay" data-action="close-modal-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + (editing ? "Modifier l’entrée" : "Ajouter une entrée") + '">' +
        '<div class="modal-titre">' + (editing ? "Modifier l’entrée" : "Ajouter une entrée") + '</div>' +
        '<form id="entree-form">' +
          champ("Rubrique", "rubrique", e ? e.rubrique : "") +
          '<div class="champs-ligne">' +
            champ("Source", "nom", e ? e.source.nom : "") +
            champ("Territoire", "territoire", e ? e.source.territoire : "", "ex. Bas-Rhin, national") +
          '</div>' +
          champ("Adresse de la source (URL)", "url", e ? e.url : "") +
          '<div class="champs-ligne">' +
            champ("Domaine affiché", "domaine", e ? e.source.domaine : "", "se remplit depuis l'URL — modifiable") +
            champ("Date", "date", e ? e.source.date : "", "ex. 14 août 2026") +
          '</div>' +
          champ("Titre de l'entrée", "titre", e ? e.titre : "") +
          renderChampIllustration(e ? e.imageUrl : "") +
          champ("Chiffres clés", "chiffres", chiffresToText(e ? e.chiffres : []), "une valeur par ligne, « valeur | libellé », terminer par * pour la mettre en avant", true) +
          champ("Résumé factuel", "resume", e ? e.resume : "", "", true) +
          champ("Usage en cours (privé, jamais publié)", "usage", e ? e.usage : "", "", true) +
          '<div class="modal-boutons">' +
            '<span></span>' +
            '<div class="modal-boutons-droite">' +
              '<button type="button" class="btn-texte" data-action="close-modal">Annuler</button>' +
              '<button type="submit" class="btn-plein">Enregistrer</button>' +
            '</div>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function numerosPublies(){
    // un brouillon (le n° en cours, avec sa moisson) n'existe pas encore
    // pour le public : sommaire, recherche et « dernier numéro » l'ignorent.
    return numeros.filter(function(n){ return n.statut !== "brouillon"; });
  }

  function moisGroupes(){
    var tries = numerosPublies().sort(function(a, b){ return b.numero - a.numero; });
    var order = [], map = {};
    tries.forEach(function(n){
      if (!map[n.mois]) { map[n.mois] = []; order.push(n.mois); }
      map[n.mois].push(n);
    });
    return order.map(function(m){ return { mois: m, items: map[m] }; });
  }

  // Toutes les actualités du numéro, titre + nom de la source en pastille,
  // en texte simple (pas de lien : cette tuile sert à se repérer avant
  // d'ouvrir le numéro, pas à ouvrir directement une source depuis le
  // Sommaire — retour d'usage du 01/09/2026, remplace l'ancienne
  // troncature à 3 titres + « et N autres »).
  function renderNumeroCarte(n, dernier){
    // Même ordre manuel que sur l'écran du numéro (Monter/Descendre) —
    // demandé le 03/09/2026 : jusqu'ici n.entrees restait dans l'ordre de
    // lecture réseau (non garanti), sans lien avec `ordre`.
    var validees = n.entrees.slice().sort(parOrdre).filter(function(e){ return e.valide; });
    var titresHtml = validees.map(function(e){
      return '<li><span class="nc-source-pastille">' + esc(e.source.nom) + '</span><span class="nc-titre-entree">' + esc(e.titre) + '</span></li>';
    }).join("");
    // Illustration de la tuile (Lot 14, champ dédié depuis le Lot 16) :
    // choisie explicitement par l'enseignant (numero.imageUrl) — plus de
    // déduction automatique depuis une entrée, jugée peu lisible (« je ne
    // comprends pas bien comment l'illustration est sélectionnée »).
    // Absente si le champ n'a jamais été renseigné, sans repli.
    // Chargement EAGER, pas lazy (constaté 02/09/2026 : retour utilisateur
    // « le cadre est plus grand que l'image, ce qui donne un espace vide
    // sous l'image » — l'image du n° 2 restait indéfiniment `complete:
    // false, naturalWidth: 0` malgré une image valide et rapide à charger
    // en direct ; forcer `loading="eager"` en JS la charge instantanément).
    // Sans rapport avec le CSS (`.nc-image{object-fit:cover}` + `stretch`
    // dimensionnent la boîte correctement que l'image soit chargée ou non
    // — vérifié). Cette tuile est de toute façon quasi toujours au-dessus
    // de la ligne de flottaison (c'est LE visuel de tête du Sommaire) :
    // le différer n'apporte rien, au prix de ce risque d'espace vide.
    var image = n.imageUrl ? '<img class="nc-image" src="' + esc(n.imageUrl) + '" alt="">' : "";
    // Tuile entièrement cliquable (Lot 16, retour d'usage : « on retire
    // l'espace à droite avec le compteur d'actualités ») : un seul geste
    // pour ouvrir le numéro, plus de bouton dédié séparé — <button> plutôt
    // que <div> pour rester accessible au clavier (focus + Entrée), comme
    // les autres déclencheurs de cette action (chip du Sommaire, etc.).
    return '<button type="button" class="numero-carte' + (dernier ? " dernier" : "") + '" data-action="ouvrir-numero" data-numero="' + n.numero + '">' +
      '<div class="nc-badge"><span class="num tab-num">n° ' + n.numero + '</span>' + (dernier ? '<span class="dernier-tag">Dernier</span>' : "") + '</div>' +
      image +
      '<div class="nc-corps"><div class="nc-titre">' + esc(n.titre) + '</div><ul class="nc-liste">' + titresHtml + '</ul></div>' +
    '</button>';
  }

  function renderSommaire(){
    var groupes = moisGroupes();
    var dernierNumero = numerosPublies().reduce(function(m, n){ return n.numero > m ? n.numero : m; }, 0);
    var html = groupes.map(function(g, gi){
      var ouvert = gi === 0 || !!state.sommaireDeplie[g.mois];
      var totalActus = g.items.reduce(function(s, n){ return s + n.entrees.filter(function(e){ return e.valide; }).length; }, 0);
      var tete = '<div class="sommaire-mois"><span class="nom">' + esc(g.mois) + '</span><span class="filet"></span>' +
        '<span class="compte">' + g.items.length + ' numéro' + (g.items.length > 1 ? "s" : "") + ' · ' + totalActus + ' actualité' + (totalActus > 1 ? "s" : "") + '</span>' +
        (gi > 0 ? '<button type="button" class="deplier" data-action="deplier-mois" data-mois="' + esc(g.mois) + '"><span class="chevron">' + (ouvert ? "▾" : "▸") + '</span><span>' + (ouvert ? "Replier" : "Déplier") + '</span></button>' : "") +
        '</div>';
      if (!ouvert) {
        var chips = g.items.map(function(n){
          var sem = n.semaine.match(/semaine (\d+)/);
          return '<button type="button" class="chip" data-action="ouvrir-numero" data-numero="' + n.numero + '">n° ' + n.numero + (sem ? " · sem. " + sem[1] : "") + '</button>';
        }).join("");
        return tete + '<div class="mois-replie">' + chips + '</div>';
      }
      return tete + g.items.map(function(n){ return renderNumeroCarte(n, n.numero === dernierNumero); }).join("");
    }).join("");
    // Seul point d'entrée vers la connexion en vue publique (retour d'usage
    // 02/09/2026) : discret, en bas de la seule page Sommaire — pas dans le
    // bandeau (visible sur tous les écrans, y compris à des élèves qui n'en
    // ont pas l'usage). Glyphe-caractère plutôt qu'une icône dessinée, dans
    // l'esprit du système (voir DESIGN.md, Navigation).
    var connexionDiscrete = estRedacteurActif() ? "" :
      '<button type="button" class="connexion-discrete" data-action="ouvrir-connexion" title="Espace réservé à l\'équipe pédagogique">⚿ Connexion</button>';
    return '<h1 class="sr-only">Sommaire</h1><div class="sommaire">' + html + connexionDiscrete + '</div>';
  }

  function normalise(s){
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function toutesLesRubriques(){
    var vues = {}, list = [];
    numerosPublies().forEach(function(n){
      n.entrees.forEach(function(e){
        if (e.valide && !vues[e.rubrique]) { vues[e.rubrique] = true; list.push(e.rubrique); }
      });
    });
    return list;
  }

  function extraitAutour(texte, qNorm, rayon){
    var hay = normalise(texte);
    var idx = hay.indexOf(qNorm);
    if (idx === -1) return texte;
    var start = Math.max(0, idx - rayon), end = Math.min(texte.length, idx + qNorm.length + rayon);
    return (start > 0 ? "…" : "") + texte.slice(start, end) + (end < texte.length ? "…" : "");
  }

  function surligne(texte, qNorm){
    if (!qNorm) return esc(texte);
    var hay = normalise(texte), out = "", i = 0, idx;
    while ((idx = hay.indexOf(qNorm, i)) !== -1) {
      out += esc(texte.slice(i, idx)) + '<mark class="surlignage">' + esc(texte.slice(idx, idx + qNorm.length)) + '</mark>';
      i = idx + qNorm.length;
    }
    return out + esc(texte.slice(i));
  }

  function rechercheResultats(){
    var qRaw = state.recherche.q.trim();
    var qNorm = normalise(qRaw);
    if (!qNorm) return { qNorm: "", actus: [], sources: [] };
    var champFiltre = state.recherche.champ, rubriqueFiltre = state.recherche.rubrique;
    var actus = [];
    numerosPublies().forEach(function(n){
      n.entrees.forEach(function(e){
        if (!e.valide) return; // la recherche ne porte que sur le publié
        if (rubriqueFiltre !== "toutes" && e.rubrique !== rubriqueFiltre) return;
        var pool = [{ texte: e.titre, label: "le titre" }, { texte: e.resume, label: "le résumé" }];
        if (champFiltre !== "titres") {
          pool.push({ texte: e.source.nom, label: "la source" });
          (e.chiffres || []).forEach(function(c){ if (c.l) pool.push({ texte: c.l, label: "le bandeau de chiffres" }); });
        }
        // e.usage n'est jamais ajouté au pool : jamais publié, donc jamais indexé (règle 11)
        var hit = pool.filter(function(p){ return p.texte && normalise(p.texte).indexOf(qNorm) !== -1; })[0];
        if (!hit) return;
        actus.push({ e: e, n: n, extrait: extraitAutour(hit.texte, qNorm, 70), label: hit.label });
      });
    });
    actus.sort(function(a, b){ return b.n.numero - a.n.numero; });
    var vues = {}, sources = [];
    actus.forEach(function(r){
      var key = r.e.url || r.e.id;
      if (vues[key]) return;
      vues[key] = true;
      sources.push(r);
    });
    return { qNorm: qNorm, actus: actus, sources: sources };
  }

  function renderRecherche(){
    var res = rechercheResultats();
    var rubriques = toutesLesRubriques();
    var numerosPub = numerosPublies();
    var totalNumeros = numerosPub.length;
    var totalActus = numerosPub.reduce(function(s, n){ return s + n.entrees.filter(function(e){ return e.valide; }).length; }, 0);

    var barre = '<h1 class="sr-only">Recherche</h1><div class="recherche-barre">' +
      '<label class="recherche-label" for="recherche-q">Chercher dans tous les numéros</label>' +
      '<form id="recherche-form">' +
        '<div class="recherche-ligne"><div class="recherche-champ-texte">' +
          '<input id="recherche-q" type="text" placeholder="mot-clé, source, territoire…" value="' + esc(state.recherche.q) + '">' +
          '<button type="submit">Chercher</button>' +
        '</div></div>' +
        '<div class="recherche-filtres">' +
          '<div class="filtre-groupe"><span class="lbl">Chercher dans</span><div class="filtre-toggle">' +
            '<button type="button" data-action="recherche-champ" data-champ="tout" aria-pressed="' + (state.recherche.champ === "tout") + '">tout le texte</button>' +
            '<button type="button" data-action="recherche-champ" data-champ="titres" aria-pressed="' + (state.recherche.champ === "titres") + '">titres seuls</button>' +
          '</div></div>' +
          '<div class="filtre-groupe"><span class="lbl">Rubrique</span><select class="filtre-select" data-action="recherche-rubrique">' +
            '<option value="toutes"' + (state.recherche.rubrique === "toutes" ? " selected" : "") + '>Toutes</option>' +
            rubriques.map(function(r){ return '<option value="' + esc(r) + '"' + (state.recherche.rubrique === r ? " selected" : "") + '>' + esc(r) + '</option>'; }).join("") +
          '</select></div>' +
        '</div>' +
      '</form>' +
    '</div>';

    if (!res.qNorm) {
      return '<div class="recherche">' + barre + '<div class="recherche-corps"><div class="recherche-vide">Tapez un mot-clé pour chercher dans les ' + totalNumeros + ' numéros publiés (' + totalActus + ' actualités).</div></div></div>';
    }

    if (!res.actus.length) {
      // état limite ⑤ « recherche sans résultat » (REGLES.md, écran 4a)
      var rubriqueFiltre = state.recherche.rubrique;
      var filtreHtml = "";
      if (rubriqueFiltre !== "toutes") {
        var elargi = (function(){
          var save = state.recherche.rubrique;
          state.recherche.rubrique = "toutes";
          var r = rechercheResultats();
          state.recherche.rubrique = save;
          return r;
        })();
        var numsElargis = {};
        elargi.actus.forEach(function(r){ numsElargis[r.n.numero] = true; });
        var compte = Object.keys(numsElargis).length;
        filtreHtml = '<div class="filtre-rappel">Le filtre « ' + esc(rubriqueFiltre) + ' » est actif' +
          (compte ? " — l'élargir couvrirait " + compte + " numéro" + (compte > 1 ? "s" : "") + " de plus." : ".") + '</div>';
      }
      var corpsVide = '<div class="etat-limite">' +
        '<span class="glyphe">⌕</span>' +
        '<h2>Rien pour « ' + esc(state.recherche.q.trim()) + ' » dans les ' + totalNumeros + ' numéros</h2>' +
        '<p>Le carnet cherche les noms comme ses sources : vérifier l\'orthographe, ou essayer un mot plus général.</p>' +
        filtreHtml +
      '</div>';
      return '<div class="recherche">' + barre + '<div class="recherche-corps">' + corpsVide + '</div></div>';
    }

    var totalResultats = res.actus.length + res.sources.length;
    var compteur = '<div class="recherche-compteur"><strong>' + totalResultats + ' résultat' + (totalResultats > 1 ? "s" : "") + '</strong> — ' +
      res.actus.length + ' actualité' + (res.actus.length > 1 ? "s" : "") + ' · ' + res.sources.length + ' source' + (res.sources.length > 1 ? "s" : "") +
      ' &nbsp;·&nbsp; cherché dans ' + totalNumeros + ' numéros, ' + totalActus + ' actualités publiées</div>';

    var actusHtml = !res.actus.length
      ? '<div class="recherche-vide">Aucune actualité ne correspond à cette recherche.</div>'
      : '<div class="resultats-tete"><span>Les actualités</span><span class="filet"></span><span>' + res.actus.length + ' · classées par numéro</span></div>' +
        res.actus.map(function(r){
          var e = r.e, n = r.n;
          return '<div class="resultat-actu">' +
            '<div class="ra-corps">' +
              '<div class="ra-meta"><span class="nom">' + esc(e.source.nom) + '</span>' + (e.source.territoire ? '<span class="pastille-echelle">' + esc(e.source.territoire) + '</span>' : "") + '<span class="meta-mono">' + esc(e.source.date) + '</span></div>' +
              '<div class="ra-titre">' + surligne(e.titre, res.qNorm) + '</div>' +
              '<div class="ra-extrait">' + surligne(r.extrait, res.qNorm) + '</div>' +
              '<div class="ra-ou">trouvé dans ' + r.label + '</div>' +
            '</div>' +
            '<div class="ra-droite"><span class="parue">Parue dans</span><button type="button" class="num" data-action="ouvrir-numero" data-numero="' + n.numero + '">n° ' + n.numero + '</button><span class="meta-mono">' + esc(n.semaine.replace(/^semaine /, "sem. ")) + '</span><span>' + esc(e.rubrique) + '</span></div>' +
          '</div>';
        }).join("");

    var sourcesHtml = !res.sources.length ? "" :
      '<div class="resultats-tete"><span>Les sources</span><span class="filet"></span><span>' + res.sources.length + '</span></div>' +
      '<div class="sources-grille">' +
      res.sources.map(function(r){
        var e = r.e;
        return '<div class="resultat-source"><div class="rs-corps"><div class="rs-nature"><span>n° ' + r.n.numero + '</span></div><div class="rs-titre">' + surligne(e.titre, res.qNorm) + '</div></div>' +
          '<a class="rs-ouvrir" href="' + esc(e.url || ("#" + e.id)) + '" data-action="clic-source" data-id="' + e.id + '"><span>Ouvrir la source</span><span>→</span></a></div>';
      }).join("") +
      '</div>';

    return '<div class="recherche">' + barre + compteur + '<div class="recherche-corps">' + actusHtml + sourcesHtml + '</div></div>';
  }

  // Les 3 états limites d'un numéro en cours de collecte (REGLES.md, écran
  // 4b) : ② aucune entrée retenue, ③ collecte sans nouveauté, ④ collecte en
  // échec. Organiques (n° 13, le brouillon en cours) sauf le choix entre
  // ③ et ④, simulé par le sélecteur dev faute d'un vrai job de collecte
  // (voir AVANCEMENT.md).
  function renderEtatNumeroVide(){
    return '<div class="etat-limite">' +
      '<span class="glyphe">▭</span>' +
      '<h2>Le n° ' + numero.numero + ' est vide pour l\'instant</h2>' +
      '<p>Aucune entrée retenue pour l\'instant. Trier les candidats de la moisson du ' + esc(numero.collecte.date) + ' ci-dessous, ou ajouter une entrée à la main via « + Ajouter une entrée » en haut de page.</p>' +
    '</div>';
  }

  function renderEtatCollecteRien(){
    return '<div class="etat-limite">' +
      '<span class="glyphe">◇</span>' +
      '<h2>Aucune nouveauté chez les 14 sources suivies</h2>' +
      '<p>La collecte du ' + esc(numero.collecte.date) + ' a bien tourné : les 14 sources ont répondu, aucune n\'a publié depuis la dernière moisson. C\'est un résultat, pas une panne.</p>' +
      '<div class="actions"><button type="button" class="btn-ligne" data-action="relancer-collecte">Relancer la collecte</button><button type="button" class="btn-ligne" data-action="vue" data-vue="sources">Gérer les sources</button></div>' +
    '</div>';
  }

  function renderEtatCollecteEchec(){
    var enEchec = sourcesSuivies.filter(function(s){ return s.derniereMoisson.statut === "echec"; });
    var detail = enEchec.map(function(s){ return s.nom + " · " + s.derniereMoisson.detail; }).join("\n");
    var repondu = sourcesSuivies.length - enEchec.length;
    return '<div class="etat-limite erreur">' +
      '<span class="glyphe">✕</span>' +
      '<h2>La collecte du ' + esc(numero.collecte.date) + ' ne s\'est pas terminée</h2>' +
      '<p>' + repondu + ' sources sur ' + sourcesSuivies.length + ' ont répondu ; ' + enEchec.length + ' n\'' + (enEchec.length > 1 ? "ont" : "a") + ' pas pu être jointe' + (enEchec.length > 1 ? "s" : "") + '. Les entrées déjà rapportées sont dans la moisson, la liste des sources en échec est consultable.</p>' +
      '<div class="detail-liste">' + esc(detail) + '</div>' +
      '<div class="actions"><button type="button" class="btn-plein" data-action="relancer-collecte">Relancer les ' + enEchec.length + ' sources</button></div>' +
    '</div>';
  }

  function renderMoissonAlerte(){
    if (numero.moisson == null) return null; // numéro déjà bouclé : pas de suivi de moisson
    if (entrees.filter(function(e){ return e.valide; }).length > 0) return null; // au moins une entrée retenue : écran normal
    if (numero.collecte.statut === "echec") return renderEtatCollecteEchec();
    if (numero.collecte.statut === "rien") return renderEtatCollecteRien();
    return renderEtatNumeroVide();
  }

  // Un candidat de moisson au même niveau de détail qu'une entrée retenue
  // (renderEntree) : titre, chiffres, résumé, lien source cliquable — plus
  // le geste « écarter avec motif » toujours visible sur la carte (Lot 10,
  // retour d'usage du 31/08/2026 : la modale précédente était trop petite
  // et le motif d'écart, caché derrière un window.prompt, n'était pas
  // découvert à l'usage).
  function renderCandidat(c){
    var src = c.source || {};
    var probleme = !c.url || c.lienMort;
    var noteProbleme = c.lienMort ? "lien mort" : (!c.url ? "pas encore de lien" : "");
    var btn = c.url
      ? '<a class="btn-source-compact" href="' + esc(c.url) + '" target="_blank" rel="noopener"><span class="lib">Ouvrir la source<span class="fleche">→</span></span><span class="domaine">' + esc(src.domaine || "") + '</span></a>'
      : '<span class="btn-source-compact desactive"><span class="lib">Pas encore de lien</span></span>';
    var chiffresHtml = (c.chiffres && c.chiffres.length)
      ? '<div class="flat-chiffres tab-num">' + c.chiffres.map(esc).join(" · ") + '</div>'
      : "";
    var resumeHtml = c.resume ? '<div class="flat-resume">' + esc(c.resume) + '</div>' : "";
    var ecartPanel = state.ecarterOuvert === c.id
      ? '<div class="ecart-panel">' +
          '<label class="lbl" for="motif-ecart-' + c.id + '">Motif de l\'écart (facultatif — lu par la routine de veille automatisée, jamais par les élèves)</label>' +
          '<textarea id="motif-ecart-' + c.id + '" data-role="motif-ecart"></textarea>' +
          '<div class="boutons"><button type="button" class="btn-texte" data-action="annuler-ecart">Annuler</button><button type="button" class="btn-mini danger" data-action="confirmer-ecart" data-id="' + c.id + '">Écarter définitivement</button></div>' +
        '</div>'
      : "";

    return '<div class="entree moisson-candidat' + (probleme ? " probleme" : "") + '" data-candidat="' + c.id + '">' +
      '<div class="entree-row">' +
        '<div class="entree-row-gauche">' +
          '<div class="flat">' +
            '<div class="flat-meta">' +
              '<span class="nom">' + esc(src.nom || "") + '</span>' +
              (src.territoire ? '<span class="pastille-echelle">' + esc(src.territoire) + '</span>' : "") +
              '<span class="meta-mono">' + esc(src.domaine || "") + (src.date ? ' · ' + esc(src.date) : "") + '</span>' +
              '<span class="etat-pastille">◇ candidat · ' + esc(c.rubrique) + '</span>' +
              (noteProbleme ? '<span class="etat-pastille mort">✕ ' + noteProbleme + '</span>' : "") +
            '</div>' +
            '<div class="flat-titre">' + esc(c.titre) + '</div>' +
            chiffresHtml +
            resumeHtml +
          '</div>' +
        '</div>' +
        '<div class="entree-row-droite">' +
          btn +
          '<div class="entree-actions">' +
            '<button type="button" class="btn-mini" data-action="retenir-candidat" data-id="' + c.id + '">Retenir</button>' +
            '<button type="button" class="btn-mini danger" data-action="ecarter-candidat" data-id="' + c.id + '">Écarter…</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      ecartPanel +
    '</div>';
  }

  // Liste de moisson intégrée directement à l'écran du numéro (Lot 10) : plus
  // de modale « Voir la moisson » — retour d'usage du 31/08/2026 après un
  // 1er run réel (7 candidats), la modale était « beaucoup trop petite »
  // pour valider sérieusement chaque candidat.
  function renderMoissonSection(){
    if (numero.moisson == null || !numero.moisson.length) return "";
    return '<div class="moisson-section">' +
      '<div class="moisson-entete"><span class="titre">Moisson du ' + esc(numero.collecte.date) + '</span><span>' + numero.moisson.length + ' candidat' + (numero.moisson.length > 1 ? "s" : "") + ' en attente de tri — retenir ou écarter chacun ci-dessous</span></div>' +
      numero.moisson.map(renderCandidat).join("") +
    '</div>';
  }

  function devOutilsCollecte(){
    if (numero.moisson == null) return "";
    function opt(v, l){ return '<option value="' + v + '"' + (numero.collecte.statut === v ? " selected" : "") + '>' + l + '</option>'; }
    return '<div class="dev-outils"><span class="dev-label">Dev</span><span>Simuler la collecte du ' + esc(numero.collecte.date) + '</span>' +
      '<select data-action="collecte-statut">' + opt("rapporte", "rapportée (normale)") + opt("rien", "rien de neuf") + opt("echec", "échec partiel") + '</select></div>';
  }

  function renderSelecteurNumero(){
    var tries = numeros.slice().sort(function(a, b){ return b.numero - a.numero; });
    var options = tries.map(function(n){
      var sem = n.semaine.match(/^semaine (\d+)/);
      var label = "n° " + n.numero + (n.statut === "brouillon" ? " · brouillon" : (sem ? " · sem. " + sem[1] : " · publié"));
      return '<option value="' + n.numero + '"' + (n.numero === numero.numero ? " selected" : "") + '>' + esc(label) + '</option>';
    }).join("");
    return '<label class="select-numero-wrap"><span class="lbl">Numéro en cours</span><select class="select-numero" data-action="changer-numero">' + options + '</select></label>';
  }

  function renderNumeroPage(){
    if (state.mode === "publiee" && numero.statut === "brouillon") {
      return '<div class="etat-limite"><span class="glyphe">◇</span><h1>Ce numéro n\'est pas encore publié</h1><p>Il est en cours de préparation en rédaction et n\'existe pas encore pour les étudiants.</p></div>';
    }

    // Compteur de fréquentation (Lot 6) : une fois par ouverture d'un numéro
    // publié en vue publiée, pas à chaque re-rendu (state.vuesComptees).
    if (state.mode === "publiee" && numero.statut === "publie" && !state.vuesComptees[numero.numero]) {
      state.vuesComptees[numero.numero] = true;
      compterVueNumero(numero.numero);
    }

    // Liste à plat (Lot 17) : plus de sections par rubrique à l'écran — la
    // rubrique de chaque entrée est indiquée par une pastille sur l'entrée
    // elle-même (renderEntree()/renderEntreeCarte()) plutôt que par un
    // titre de groupe. entreesOrdonnees() donne l'ordre d'affichage complet
    // du numéro (voir son commentaire pour la compatibilité avec l'ancien
    // ordre par rubrique du Lot 10bis).
    var visibles = entreesOrdonnees().filter(function(e){ return state.mode === "redaction" || e.valide; });
    var total = visibles.length;

    var alerte = state.mode === "redaction" ? renderMoissonAlerte() : null;
    var corpsHtml;
    if (alerte !== null) {
      corpsHtml = alerte;
    } else if (state.mode === "redaction") {
      corpsHtml = visibles.map(function(e, i){ return renderEntree(e, i === 0, i === visibles.length - 1); }).join("");
    } else {
      // Vue publiée : deux rendus complets côte à côte — le « classique »
      // (renderEntree(), grille 2 colonnes du Lot 4quater) réservé au
      // repli d'impression navigateur (Ctrl+P ; le bouton « Imprimer ce
      // numéro » utilise un chemin totalement séparé, jsPDF, qui ne lit
      // jamais ce HTML), la « carte » (renderEntreeCarte(), grille
      // responsive) réservée à l'écran — voir le commentaire en tête de
      // renderEntreeCarte() et .mode-publiee .entree / .carte-grille en CSS.
      var itemsClassique = visibles.map(function(e, i){ return renderEntree(e, i === 0, i === visibles.length - 1); }).join("");
      var itemsCartes = '<div class="carte-grille">' + visibles.map(function(e){ return renderEntreeCarte(e); }).join("") + '</div>';
      corpsHtml = itemsClassique + itemsCartes;
    }

    var publieBadge = numero.statut === "publie" ? '<span class="etat-pastille ok">✓ publié</span>' : "";
    // Dépublier (demandé le 01/09/2026) : remet un numéro publié en
    // brouillon (invisible des élèves, à nouveau modifiable librement) —
    // jusqu'ici publier était une action à sens unique, aucun moyen de
    // revenir en arrière sans intervention en base.
    var boutonPublication = numero.statut === "publie"
      ? '<button class="btn-ligne danger" type="button" data-action="depublier-numero">Dépublier le n° ' + numero.numero + '</button>'
      : '<button class="btn-plein" type="button" data-action="publier-numero">Publier le n° ' + numero.numero + '</button>';
    var enteteActions = state.mode === "redaction"
      ? '<div class="entete-actions">' + renderSelecteurNumero() +
        '<div class="entete-compteur"><span class="n tab-num">' + entrees.filter(function(e){return e.valide;}).length + '</span><span class="l">sur ' + numero.candidates + ' candidates</span>' + publieBadge + '</div>' +
        '<div class="entete-boutons"><button class="btn-ligne" type="button" data-action="new-entree">+ Ajouter une entrée</button><button class="btn-ligne" type="button" data-action="recuperer-illustrations-manquantes">Récupérer les illustrations manquantes</button><button class="btn-ligne" type="button" data-action="nouveau-numero">+ Nouveau numéro</button><button class="btn-imprimer" type="button" data-action="imprimer">Imprimer ce numéro</button>' + boutonPublication + '<button class="btn-ligne danger" type="button" data-action="supprimer-numero">Supprimer ce numéro</button></div>' +
        renderChampIllustrationNumero() +
        '<button type="button" class="lien-action" data-action="preview-premier">Aperçu : tout premier lancement (dev)</button>' +
        devOutilsCollecte() +
      '</div>'
      : "";

    // Rail à droite ("Les N sources du numéro") retiré (retour d'usage du
    // 01/09/2026 : doublon inutile avec le bouton « Ouvrir la source » déjà
    // sur chaque entrée) — une seule colonne pleine largeur, même structure
    // en rédaction et en vue publiée.
    var corpsWrap = '<div class="corps"><div class="colonne">' + corpsHtml + (state.mode === "redaction" ? renderMoissonSection() : "") + '</div></div>';

    var banniere = state.mode === "redaction" ? '<div class="mode-banniere">Mode rédaction — non visible des élèves tant que le numéro n\'est pas publié</div>' : "";

    var printEntete = '<div class="print-entete">' +
      '<div class="print-ligne1">Carnet de veille naturaliste · BTS Gestion et protection de la nature · Kerplouz</div>' +
      '<div class="print-ligne2">' +
        '<span class="print-numero"><span class="chiffre">N° ' + numero.numero + '</span><span class="print-titre">' + esc(numero.titre) + '</span></span>' +
        '<span class="print-meta">' + esc(numero.semaine.replace(/^semaine /, "sem. ")) + ' · ' + total + ' actualité' + (total > 1 ? "s" : "") + ' · imprimé le ' + esc(dateImpression()) + '</span>' +
      '</div>' +
    '</div>';

    var printPied = '<div class="print-pied"><div class="gauche">' + qrSvg(location.href, "QR vers tous les numéros du carnet") + '<span>Tous les numéros du carnet<br>portail.btsgpn-kerplouz.fr/carnet-de-veille</span></div><span>Adresses vérifiées le ' + esc(numero.collecte ? numero.collecte.date : dateImpression()) + '</span></div>';

    return banniere +
      '<div class="numero-entete">' +
        '<div class="entete-principal">' +
          '<div class="entete-num-ligne"><span class="entete-num-badge"><span class="lbl">N°</span>' + numero.numero + '</span>' +
          (state.mode === "redaction" ? '<button type="button" class="lien-num-edit" data-action="renommer-numero" title="Changer le numéro de ce n°">✎</button>' : "") +
          '<h1 class="entete-titre">' + ed(esc(numero.titre), "numero.titre") + '</h1></div>' +
          '<div class="entete-semaine">' + ed(esc(numero.semaine), "numero.semaine") + '</div>' +
          (state.mode === "redaction" ? '<p class="entete-chapo">' + ed(esc(numero.chapo), "numero.chapo") + '</p>' : "") +
        '</div>' +
        enteteActions +
      '</div>' +
      printEntete +
      corpsWrap +
      printPied;
  }

  // État limite ① (REGLES.md, écran 4b) : « OÙ · à la place du numéro, sur
  // l'adresse du carnet, tant qu'aucun numéro n'est publié. » Comme aucun
  // vrai premier lancement n'est reproductible avec le jeu de démonstration
  // (8 numéros déjà publiés), il se déclenche par le lien dev de la barre
  // d'actions en rédaction plutôt que par un état réel — voir AVANCEMENT.md.
  function renderEtatPremierLancement(){
    return '<div class="etat-limite">' +
      '<span class="glyphe">◇</span>' +
      '<h1>Le premier numéro paraîtra vendredi</h1>' +
      '<p>Le carnet est une veille hebdomadaire : chaque vendredi, l\'équipe pédagogique publie les actualités naturalistes de la semaine, avec leurs documents d\'origine.</p>' +
      '<div class="rien-a-faire">Rien à faire — revenir vendredi.</div>' +
      '<div class="actions"><button type="button" class="lien-action" data-action="preview-normal">‹ Revenir à l\'aperçu normal (dev)</button></div>' +
    '</div>';
  }

  function validerPublication(){
    return entrees.filter(function(e){ return e.valide; }).map(function(e){
      if (e.lienMort) return { id: e.id, titre: e.titre, type: "mort", message: "lien mort depuis le " + e.lienMortDepuis + ". Corriger l'adresse ou écarter l'entrée." };
      if (!e.url || !e.url.trim()) return { id: e.id, titre: e.titre, type: "vide", message: "bloc source vide. Un lien au minimum est exigé." };
      return null;
    }).filter(Boolean);
  }

  function renderPublicationRefusee(){
    if (!state.publicationRefusee) return "";
    var pr = state.publicationRefusee;
    var titre = pr.fautives.length > 1 ? (pr.fautives.length + " entrées bloquent la publication du n° " + pr.numeroId) : ("Une entrée bloque la publication du n° " + pr.numeroId);
    return '<div class="modal-overlay" data-action="close-refus-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-label="Publication refusée">' +
        '<span class="glyphe-alerte">⚠</span>' +
        '<div class="modal-titre">' + esc(titre) + '</div>' +
        '<div class="refus-liste">' +
          pr.fautives.map(function(f){ return '<div class="refus-item' + (f.type === "vide" ? " vide" : "") + '"><b>' + esc(f.titre) + '</b> — ' + esc(f.message) + '</div>'; }).join("") +
        '</div>' +
        '<div class="modal-boutons"><button type="button" class="btn-plein" data-action="regler-fautive" data-id="' + pr.fautives[0].id + '">Régler la première</button><div class="modal-boutons-droite"><button type="button" class="btn-texte" data-action="close-refus">Fermer</button></div></div>' +
      '</div>' +
    '</div>';
  }

  // ---- sources suivies (lot 4, écran 5a) ----
  function renderSourceRow(s, retirable){
    var actions = [];
    if (s.derniereMoisson.statut === "echec") actions.push('<button type="button" class="lien-action" data-action="source-reessayer" data-id="' + s.id + '">Réessayer</button>');
    actions.push('<button type="button" class="lien-action" data-action="source-edit" data-id="' + s.id + '">Modifier</button>');
    if (retirable) actions.push('<button type="button" class="lien-action danger" data-action="source-remove" data-id="' + s.id + '">Ne plus suivre</button>');

    var moissonTxt = s.derniereMoisson.statut === "echec"
      ? '<span class="echec">échec · ' + esc(s.derniereMoisson.date) + '</span>'
      : esc(s.derniereMoisson.date) + ' · ' + s.derniereMoisson.entrees + ' entrée' + (s.derniereMoisson.entrees > 1 ? "s" : "");

    return '<div class="source-row">' +
      '<div class="source-nom">' +
        '<span class="nom">' + esc(s.nom) + '</span>' +
        '<span class="adresse">' + esc(s.adresse) + ' · ' + esc(s.type) + ' · ' + esc(s.echelle) + (s.territoire ? " · " + esc(s.territoire) : "") + '</span>' +
        (s.derniereMoisson.statut === "echec" ? '<span class="echec-note">× ' + esc(s.derniereMoisson.detail) + (s.derniereMoisson.note ? " · " + esc(s.derniereMoisson.note) : "") + '</span>' : "") +
      '</div>' +
      '<div class="source-rubrique">' + esc(s.rubriqueDefaut) + '</div>' +
      '<div class="source-moisson">' + moissonTxt + '</div>' +
      '<div class="source-rapporte"><span class="n tab-num">' + s.compteurs.retenues + '</span><span class="l">retenue' + (s.compteurs.retenues > 1 ? "s" : "") + ' sur ' + s.compteurs.rapportees + ' rapportée' + (s.compteurs.rapportees > 1 ? "s" : "") + (s.compteurs.depuis ? " depuis " + esc(s.compteurs.depuis) : "") + '</span></div>' +
      '<div class="source-actions">' + actions.join("") + '</div>' +
    '</div>';
  }

  function renderSourcesEcran(){
    var totalEchec = sourcesSuivies.filter(function(s){ return s.derniereMoisson.statut === "echec"; }).length;
    var derniereDate = sourcesSuivies.length ? sourcesSuivies[0].derniereMoisson.date : "";

    var entete = '<h1 class="sr-only">Sources suivies</h1><div class="sources-entete">' +
      '<div class="sources-entete-principal"><span class="label">Les sources suivies</span><span class="total"><b class="tab-num">' + sourcesSuivies.length + '</b>interrogées chaque samedi à 6 h</span></div>' +
      '<div class="sources-collecte"><span class="label">Dernière collecte</span><span class="valeur">' + esc(derniereDate) + (totalEchec ? ' · <span class="echec">' + totalEchec + ' en échec</span>' : "") + '</span></div>' +
      '<div class="sources-entete-actions"><button type="button" class="btn-ligne" data-action="relancer-collecte">Relancer la collecte</button><button type="button" class="btn-plein" data-action="source-add">+ Suivre une source</button></div>' +
    '</div>';

    var cols = '<div class="sources-cols"><span>Source</span><span>Rubrique par défaut</span><span>Dernière moisson</span><span>Ce qu\'elle a rapporté</span><span></span></div>';

    var echec = sourcesSuivies.filter(function(s){ return s.derniereMoisson.statut === "echec"; });
    var reste = sourcesSuivies.filter(function(s){ return s.derniereMoisson.statut !== "echec"; });
    var attention = reste.filter(function(s){ return s.compteurs.rapportees && (s.compteurs.retenues / s.compteurs.rapportees) < 0.05; });
    var autres = reste.filter(function(s){ return attention.indexOf(s) === -1; });

    var groupeEchec = !echec.length ? "" :
      '<div class="groupe-titre echec"><span>En échec à la dernière collecte — ' + echec.length + '</span></div>' +
      echec.map(function(s){ return renderSourceRow(s, false); }).join("");

    var groupeAttention = !attention.length ? "" :
      '<div class="groupe-titre"><span>Rien de retenu depuis longtemps — ' + attention.length + ' · à confirmer ou à retirer</span></div>' +
      attention.map(function(s){ return renderSourceRow(s, true); }).join("");

    var visiblesAutres = state.sourcesDeplie ? autres : autres.slice(0, 2);
    var masquees = state.sourcesDeplie ? [] : autres.slice(2);
    var groupeAutres = !autres.length ? "" :
      '<div class="groupe-titre"><span>Les ' + autres.length + ' autres — rien à décider</span><span class="filet"></span>' +
      (autres.length > 2 ? '<button type="button" class="deplier" data-action="deplier-sources">' + (state.sourcesDeplie ? "Replier" : "Déplier les " + (autres.length - 2)) + '</button>' : "") +
      '</div>' +
      visiblesAutres.map(function(s){ return renderSourceRow(s, false); }).join("") +
      (masquees.length ? '<div class="sources-replie"><span class="chip">' + masquees.map(function(s){ return esc(s.nom); }).join(" · ") + '</span></div>' : "");

    return '<div class="sources">' + entete + '<div class="sources-table">' + cols + groupeEchec + groupeAttention + groupeAutres + '</div></div>';
  }

  // ---- Bilan de fréquentation (Lot 13) : totaux seulement (vues par
  // numéro, clics « Ouvrir la source » par entrée) — compteurs cumulés
  // posés et branchés depuis le Lot 6, jamais encore affichés nulle part.
  // Pas d'historique daté en base pour l'instant (voir AVANCEMENT.md) :
  // pas de graphique temporel ici, seulement des totaux triés avec une
  // barre de comparaison relative.
  function renderBilanRowNumero(n, maxVues){
    var vues = n.vues || 0;
    var pct = maxVues ? Math.round((vues / maxVues) * 100) : 0;
    return '<div class="source-row bilan-row bilan-row-2">' +
      '<div class="source-nom"><span class="nom">n° ' + n.numero + (n.titre ? " · " + esc(n.titre) : "") + '</span><span class="adresse">' + esc(n.semaine || "") + '</span></div>' +
      '<div class="bilan-mesure"><div class="bilan-barre"><div class="bilan-barre-remplie" style="width:' + pct + '%"></div></div><span class="n tab-num">' + vues + '</span></div>' +
    '</div>';
  }

  function renderBilanRowEntree(e, n, maxClics){
    var clics = e.clicsSource || 0;
    var pct = maxClics ? Math.round((clics / maxClics) * 100) : 0;
    return '<div class="source-row bilan-row">' +
      '<div class="source-nom"><span class="nom">' + esc(e.titre || "(sans titre)") + '</span><span class="adresse">' + esc(e.rubrique || "") + '</span></div>' +
      '<div class="source-rubrique">n° ' + n.numero + '</div>' +
      '<div class="bilan-mesure"><div class="bilan-barre"><div class="bilan-barre-remplie" style="width:' + pct + '%"></div></div><span class="n tab-num">' + clics + '</span></div>' +
    '</div>';
  }

  function renderBilanEcran(){
    var numerosVus = numeros.filter(function(n){ return n.statut !== "brouillon"; });
    var totalVues = numerosVus.reduce(function(s, n){ return s + (n.vues || 0); }, 0);

    var toutesEntrees = [];
    numeros.forEach(function(n){ (n.entrees || []).forEach(function(e){ toutesEntrees.push({ e: e, n: n }); }); });
    var totalClics = toutesEntrees.reduce(function(s, x){ return s + (x.e.clicsSource || 0); }, 0);

    var numeroTop = numerosVus.slice().sort(function(a, b){ return (b.vues || 0) - (a.vues || 0); })[0];

    var entete = '<h1 class="sr-only">Bilan de fréquentation</h1><div class="sources-entete">' +
      '<div class="sources-entete-principal"><span class="label">Vues cumulées</span><span class="total"><b class="tab-num">' + totalVues + '</b>sur ' + numerosVus.length + ' numéro' + (numerosVus.length > 1 ? "s" : "") + ' publié' + (numerosVus.length > 1 ? "s" : "") + '</span></div>' +
      '<div class="sources-entete-principal"><span class="label">Clics « Ouvrir la source »</span><span class="total"><b class="tab-num">' + totalClics + '</b>sur ' + toutesEntrees.length + ' entrée' + (toutesEntrees.length > 1 ? "s" : "") + '</span></div>' +
      (numeroTop && numeroTop.vues ? '<div class="sources-collecte"><span class="label">Numéro le plus consulté</span><span class="valeur">n° ' + numeroTop.numero + ' · ' + numeroTop.vues + ' vue' + (numeroTop.vues > 1 ? "s" : "") + '</span></div>' : "") +
    '</div>';

    var numerosTries = numerosVus.slice().sort(function(a, b){ return (b.vues || 0) - (a.vues || 0); });
    var maxVues = numerosTries.reduce(function(m, n){ return Math.max(m, n.vues || 0); }, 0);
    var colsNum = '<div class="sources-cols bilan-cols bilan-cols-2"><span>Numéro</span><span>Vues</span></div>';
    var sectionNum = '<div class="groupe-titre"><span>Numéros — du plus au moins consulté</span></div>' +
      colsNum + numerosTries.map(function(n){ return renderBilanRowNumero(n, maxVues); }).join("");

    var entreesTriees = toutesEntrees.slice().sort(function(a, b){ return (b.e.clicsSource || 0) - (a.e.clicsSource || 0); });
    var maxClics = entreesTriees.reduce(function(m, x){ return Math.max(m, x.e.clicsSource || 0); }, 0);
    var seuil = 10;
    var reste = entreesTriees.length - seuil;
    var visibles = state.bilanEntreesDeplie ? entreesTriees : entreesTriees.slice(0, seuil);
    var titreEnt = '<div class="groupe-titre"><span>Entrées — clics sur « Ouvrir la source » (' + entreesTriees.length + ')</span><span class="filet"></span>' +
      (reste > 0 ? '<button type="button" class="deplier" data-action="deplier-bilan-entrees">' + (state.bilanEntreesDeplie ? "Replier" : "Déplier les " + reste + " autres") + '</button>' : "") +
      '</div>';
    var colsEnt = '<div class="sources-cols bilan-cols"><span>Entrée</span><span>Numéro</span><span>Clics</span></div>';
    var sectionEnt = titreEnt + colsEnt + visibles.map(function(x){ return renderBilanRowEntree(x.e, x.n, maxClics); }).join("");

    return '<div class="sources bilan">' + entete +
      '<div class="sources-table">' + sectionNum + '</div>' +
      '<div class="sources-table bilan-section">' + sectionEnt + '</div>' +
    '</div>';
  }

  function renderModalSource(){
    if (!state.modalSource) return "";
    var editing = state.modalSource.mode === "edit";
    var s = editing ? sourcesSuivies.filter(function(x){ return x.id === state.modalSource.id; })[0] : null;
    if (editing && !s) return "";

    return '<div class="modal-overlay" data-action="close-modal-source-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + (editing ? "Modifier la source" : "Suivre une source") + '">' +
        '<div class="modal-titre">' + (editing ? "Modifier la source" : "Suivre une nouvelle source") + '</div>' +
        '<form id="source-form">' +
          champ("Nom de la source", "nom", s ? s.nom : "") +
          '<div class="champs-ligne">' +
            champ("Adresse (flux ou page)", "adresse", s ? s.adresse : "", "ex. exemple.fr/actualites.rss") +
            champ("Type", "type", s ? s.type : "flux RSS", "flux RSS ou page suivie") +
          '</div>' +
          '<div class="champs-ligne">' +
            champ("Échelle", "echelle", s ? s.echelle : "", "ex. national, régional") +
            champ("Territoire", "territoire", s ? s.territoire : "") +
          '</div>' +
          champ("Rubrique par défaut", "rubriqueDefaut", s ? s.rubriqueDefaut : "") +
          '<div class="modal-boutons">' +
            (editing ? '<button type="button" class="lien-action danger" data-action="source-remove" data-id="' + s.id + '">Ne plus suivre cette source</button>' : '<span></span>') +
            '<div class="modal-boutons-droite">' +
              '<button type="button" class="btn-texte" data-action="close-modal-source">Annuler</button>' +
              '<button type="submit" class="btn-plein">Enregistrer</button>' +
            '</div>' +
          '</div>' +
        '</form>' +
      '</div>' +
    '</div>';
  }

  // Modale ouverte au dernier rendu — sert uniquement à détecter une
  // ouverture (lot 5, audit RGAA) : render() reconstruit tout le DOM à
  // chaque appel, y compris pour des changements sans rapport avec la
  // modale (ex. cocher une case) ; sans ce repère, on redonnerait le focus
  // à la modale à chaque rendu et on l'arracherait au champ en cours de
  // saisie par le clavier.
  var modaleFoyerPrecedent = null;
  function modaleFoyerActuel(){
    return state.modal ? "modal" : state.modalSource ? "modalSource" : state.modalAuth ? "modalAuth" : state.modalNumero ? "modalNumero" : state.publicationRefusee ? "refus" : null;
  }

  // ---- Lot 7 : connexion / compte en attente / déconnexion ----

  function renderModalAuth(){
    if (!state.modalAuth) return "";
    if (state.auth.redacteur && !state.auth.redacteur.actif) {
      return '<div class="modal-overlay" data-action="close-modal-auth-backdrop">' +
