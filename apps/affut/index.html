          '<div class="modal-boutons"><span></span><div class="modal-boutons-droite"><button type="button" class="btn-texte" data-action="deconnexion">Se déconnecter</button><button type="button" class="btn-plein" data-action="close-modal-auth">Fermer</button></div></div>' +
        '</div>' +
      '</div>';
    }
    var a = state.modalAuth;
    return '<div class="modal-overlay" data-action="close-modal-auth-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-label="Connexion rédaction">' +
        '<div class="modal-titre">Connexion — rédaction</div>' +
        '<p class="aide"><strong>Espace réservé</strong> à l\'équipe pédagogique — rien à faire ici pour lire le carnet.</p>' +
        '<p class="aide">Adresse e-mail professionnelle. Le mot de passe est personnel : il est créé automatiquement à la première connexion.</p>' +
        '<form id="auth-form" novalidate>' +
          '<div class="champ"><label for="champ-auth-email">E-mail</label><input id="champ-auth-email" name="email" type="email" autocomplete="username" required></div>' +
          '<div class="champ"><label for="champ-auth-mdp">Mot de passe</label><input id="champ-auth-mdp" name="motdepasse" type="password" autocomplete="current-password" required minlength="6"></div>' +
          '<div class="modal-boutons">' +
            '<button type="button" class="lien-action" data-action="mdp-oublie"' + (a.enCours ? " disabled" : "") + '>Mot de passe oublié ?</button>' +
            '<div class="modal-boutons-droite">' +
              '<button type="button" class="btn-texte" data-action="close-modal-auth">Annuler</button>' +
              '<button type="submit" class="btn-plein"' + (a.enCours ? " disabled" : "") + '>' + (a.enCours ? "Connexion…" : "Se connecter") + '</button>' +
            '</div>' +
          '</div>' +
          (a.erreur ? '<p class="erreur" role="alert">' + esc(a.erreur) + '</p>' : "") +
          (a.info ? '<p class="aide">' + esc(a.info) + '</p>' : "") +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function renderModalNumero(){
    if (!state.modalNumero) return "";
    var n = state.modalNumero;
    // Renumérotation (Lot 23) : même modale/formulaire que la création d'un
    // numéro, seul le champ Semaine disparaît (on ne change que l'identifiant
    // `numero`, pas la semaine ni le reste) — voir renommerNumeroDistant().
    var renommer = n.renommer != null;
    var titreModal = renommer ? "Renuméroter le n° " + n.renommer : "Nouveau numéro";
    return '<div class="modal-overlay" data-action="close-modal-numero-backdrop">' +
      '<div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + esc(titreModal) + '">' +
        '<div class="modal-titre">' + esc(titreModal) + '</div>' +
        '<form id="numero-form">' +
          champ(renommer ? "Nouveau numéro" : "Numéro", "numero", String(renommer ? n.renommer : prochainNumero())) +
          (renommer ? "" : '<div class="champ"><label for="champ-numero-semaine">Semaine</label><input id="champ-numero-semaine" name="semaineIso" type="week" value="' + esc(isoSemaineActuelle()) + '" required></div>') +
          '<div class="modal-boutons"><span></span><div class="modal-boutons-droite"><button type="button" class="btn-texte" data-action="close-modal-numero">Annuler</button><button type="submit" class="btn-plein">' + (renommer ? "Renuméroter" : "Créer") + '</button></div></div>' +
          (n.erreur ? '<p class="erreur" role="alert">' + esc(n.erreur) + '</p>' : "") +
        '</form>' +
      '</div>' +
    '</div>';
  }

  function renderAucunNumero(){
    if (estRedacteurActif()) {
      return '<div class="etat-limite"><span class="glyphe">◇</span><h1>Aucun numéro pour l\'instant</h1><p>Créez le premier numéro du carnet pour commencer à rédiger.</p><div class="actions"><button type="button" class="btn-plein" data-action="nouveau-numero">+ Nouveau numéro</button></div></div>';
    }
    return '<div class="etat-limite"><span class="glyphe">◇</span><h1>Le premier numéro paraîtra bientôt</h1><p>Le carnet est une veille hebdomadaire : chaque semaine, l\'équipe pédagogique publie les actualités naturalistes, avec leurs documents d\'origine.</p><div class="rien-a-faire">Rien à faire — revenir plus tard.</div></div>';
  }

  function render(){
    bindCurrent();
    var app = document.getElementById("app");
    // vue-sommaire (Lot 14) : un peu plus large que les autres vues
    // publiques — demandé pour laisser sa pleine largeur à l'illustration
    // de tuile (nc-image), sans élargir aussi la lecture d'un numéro ou la
    // recherche, qui n'en ont pas besoin.
    app.className = "app" + (state.vue === "numero" ? " mode-" + state.mode : state.vue === "sommaire" ? " mode-publiee vue-sommaire" : " mode-publiee");

    var redacActif = estRedacteurActif();

    // Deux barres d'onglets distinctes (01/09/2026, retour d'usage sur le
    // Lot 10quater : un simple bouton « Rédaction » perdu dans le nav
    // public ne convenait pas). Hors connexion (ou compte pas encore
    // actif) : nav publique classique (texte souligné au survol/actif).
    // Rédacteur actif : une seule barre en pastilles (même style que
    // l'ancienne bascule Rédaction/Vue publiée, jugé « satisfaisant et
    // extrapolable ») avec les 3 onglets publics EN PLUS de Rédaction/Vue
    // publiée — Sommaire reste donc toujours la 1re pastille juste après
    // le logo, à la même position dans les deux cas.
    var navHtml = redacActif && numeros.length
      ? '<div class="mode-toggle" role="group" aria-label="Navigation">' +
          '<button type="button" data-action="vue" data-vue="sommaire" aria-pressed="' + (state.vue === "sommaire") + '">Sommaire</button>' +
          '<button type="button" data-action="vue" data-vue="recherche" aria-pressed="' + (state.vue === "recherche") + '">Rechercher</button>' +
          '<button type="button" data-action="vue" data-vue="sources" aria-pressed="' + (state.vue === "sources") + '">Sources</button>' +
          '<button type="button" data-action="vue" data-vue="bilan" aria-pressed="' + (state.vue === "bilan") + '">Bilan</button>' +
          '<button type="button" data-action="aller-redaction" data-mode="redaction" aria-pressed="' + (state.vue === "numero" && state.mode === "redaction") + '">Rédaction</button>' +
          '<button type="button" data-action="aller-vue-publiee" aria-pressed="' + (state.vue === "numero" && state.mode === "publiee") + '">Vue publiée</button>' +
        '</div>'
      : '<div class="bandeau-nav">' +
          '<button type="button" data-action="vue" data-vue="sommaire"' + (state.vue === "sommaire" ? ' aria-current="page"' : '') + '>Sommaire</button>' +
          '<button type="button" data-action="vue" data-vue="recherche"' + (state.vue === "recherche" ? ' aria-current="page"' : '') + '>Rechercher</button>' +
        '</div>';

    // Plus de bouton « Se connecter » dans le bandeau public (retour
    // d'usage 02/09/2026 : un espace réservé à l'équipe pédagogique n'a
    // pas à s'afficher en permanence à tous les élèves) — déplacé en bas
    // de page du Sommaire, en discret (voir renderSommaire()).
    var authHtml = redacActif
      ? '<span class="auth-statut">' + esc(state.auth.user.email) + '<button type="button" data-action="deconnexion">Déconnexion</button></span>'
      : "";

    var bandeau =
      '<div class="bandeau">' +
        '<button type="button" class="brand" data-action="vue" data-vue="sommaire">' + PICTO + '<span class="brand-name">À l\'affût</span><span class="brand-sub">BTS GPN · Kerplouz</span></button>' +
        '<div class="bandeau-spacer"></div>' +
        navHtml +
        authHtml +
      '</div>';

    var corps = !numeros.length ? renderAucunNumero()
      : state.previewEtat === "premier" ? renderEtatPremierLancement()
      : state.vue === "sommaire" ? renderSommaire()
      : state.vue === "recherche" ? renderRecherche()
      : state.vue === "sources" && redacActif ? renderSourcesEcran()
      : state.vue === "bilan" && redacActif ? renderBilanEcran()
      : renderNumeroPage();

    app.innerHTML =
      '<div class="app-liw"></div>' +
      bandeau +
      corps +
      '<div class="pied">Carnet de veille naturaliste · BTS Gestion et Protection de la Nature · Kerplouz.</div>' +
      renderModal() +
      renderModalSource() +
      renderModalAuth() +
      renderModalNumero() +
      renderPublicationRefusee();

    // Focus envoyé dans la modale seulement si elle vient de s'ouvrir
    // (lot 5, audit RGAA — 2.4.3) : sans ça, le focus clavier restait
    // perdu en haut de page après ouverture, la modale n'étant jamais
    // atteinte au Tab suivant.
    var foyerActuel = modaleFoyerActuel();
    if (foyerActuel && foyerActuel !== modaleFoyerPrecedent) {
      var modaleEl = app.querySelector('.modal[role="dialog"]');
      if (modaleEl) modaleEl.focus();
    }
    modaleFoyerPrecedent = foyerActuel;
  }

  function ouvrirConnexion(){ state.modalAuth = { erreur: null, enCours: false, info: null }; render(); }

  document.addEventListener("click", async function(ev){
    var srcClicBtn = ev.target.closest('[data-action="clic-source"]');
    if (srcClicBtn) { compterClicSource(srcClicBtn.getAttribute("data-id")); }

    var vueBtn = ev.target.closest('[data-action="vue"]');
    if (vueBtn) {
      state.vue = vueBtn.getAttribute("data-vue");
      state.modal = null; state.modalSource = null; state.modalAuth = null; state.modalNumero = null;
      state.ecarterOuvert = null; state.deplacerOuvert = null; state.ecarterEntreeOuvert = null; state.publicationRefusee = null;
      render();
      return;
    }

    if (ev.target.closest('[data-action="aller-redaction"]')) {
      state.vue = "numero";
      state.mode = "redaction";
      state.modal = null; state.modalSource = null; state.modalAuth = null; state.modalNumero = null;
      state.ecarterOuvert = null; state.deplacerOuvert = null; state.ecarterEntreeOuvert = null; state.publicationRefusee = null;
      render();
      return;
    }

    if (ev.target.closest('[data-action="aller-vue-publiee"]')) {
      state.vue = "numero";
      state.mode = "publiee";
      state.modal = null; state.modalSource = null; state.modalAuth = null; state.modalNumero = null;
      state.ecarterOuvert = null; state.deplacerOuvert = null; state.ecarterEntreeOuvert = null; state.publicationRefusee = null;
      render();
      return;
    }

    var ouvrirBtn = ev.target.closest('[data-action="ouvrir-numero"]');
    if (ouvrirBtn) {
      state.numeroId = parseInt(ouvrirBtn.getAttribute("data-numero"), 10);
      state.vue = "numero";
      state.modal = null;
      state.ecarterOuvert = null; state.deplacerOuvert = null; state.ecarterEntreeOuvert = null;
      render();
      return;
    }

    var deplierBtn = ev.target.closest('[data-action="deplier-mois"]');
    if (deplierBtn) {
      var mois = deplierBtn.getAttribute("data-mois");
      state.sommaireDeplie[mois] = !state.sommaireDeplie[mois];
      render();
      return;
    }

    var champBtn = ev.target.closest('[data-action="recherche-champ"]');
    if (champBtn) {
      var qEl = document.getElementById("recherche-q");
      if (qEl) state.recherche.q = qEl.value;
      state.recherche.champ = champBtn.getAttribute("data-champ");
      render();
      return;
    }


    // ---- Lot 7 : connexion / déconnexion ----
    if (ev.target.closest('[data-action="ouvrir-connexion"]')) { ouvrirConnexion(); return; }

    if (ev.target.closest('[data-action="deconnexion"]')) {
      state.modalAuth = null;
      render();
      try { await deconnexion(); } catch (e) { window.alert("Déconnexion : " + (e && e.message || e)); }
      return;
    }

    if (ev.target.closest('[data-action="close-modal-auth"]') || ev.target === document.querySelector('[data-action="close-modal-auth-backdrop"]')) {
      state.modalAuth = null; render(); return;
    }

    if (ev.target.closest('[data-action="mdp-oublie"]')) {
      var champEmail = document.getElementById("champ-auth-email");
      var emailVal = champEmail ? (champEmail.value || "").trim().toLowerCase() : "";
      if (!emailVal) { if (champEmail) champEmail.focus(); return; }
      try {
        await demanderReinitialisation(emailVal);
        state.modalAuth = { erreur: null, info: "Si un compte existe pour " + emailVal + ", un lien de réinitialisation vient d'être envoyé." };
      } catch (e) {
        state.modalAuth = { erreur: e.message || "Échec de l'envoi du lien.", info: null };
      }
      render();
      return;
    }

    // ---- Lot 6 : « Nouveau numéro » ----
    if (ev.target.closest('[data-action="nouveau-numero"]')) { state.modalNumero = { erreur: null }; render(); return; }

    if (ev.target.closest('[data-action="renommer-numero"]')) { state.modalNumero = { erreur: null, renommer: numero.numero }; render(); return; }

    if (ev.target.closest('[data-action="close-modal-numero"]') || ev.target === document.querySelector('[data-action="close-modal-numero-backdrop"]')) {
      state.modalNumero = null; render(); return;
    }

    var toggleBloc = ev.target.closest('[data-action="toggle-bloc"]');
    if (toggleBloc) {
      var id = toggleBloc.getAttribute("data-id"), bloc = toggleBloc.getAttribute("data-bloc");
      var entree = entrees.filter(function(e){ return e.id === id; })[0];
      if (entree) { entree.blocs[bloc] = !entree.blocs[bloc]; ecrireEntree(id, { blocs: entree.blocs }); render(); }
      return;
    }

    if (ev.target.closest('[data-action="new-entree"]')) { state.modal = { mode: "add" }; render(); return; }

    var editBtn = ev.target.closest('[data-action="edit-entree"]');
    if (editBtn) { state.modal = { mode: "edit", id: editBtn.getAttribute("data-id") }; render(); return; }

    // Panneau « supprimer et écarter avec motif » (Lot 11) : même geste que
    // « écarter avec motif » sur un candidat de moisson, disponible à tout
    // moment en rédaction (même après une dépublication) sur une entrée déjà
    // retenue — voir renderEcartEntreePanel().
    var ecarterEntreeBtn = ev.target.closest('[data-action="ecarter-entree"]');
    if (ecarterEntreeBtn) {
      var eeid = ecarterEntreeBtn.getAttribute("data-id");
      state.ecarterEntreeOuvert = state.ecarterEntreeOuvert === eeid ? null : eeid;
      state.deplacerOuvert = null;
      render();
      return;
    }

    if (ev.target.closest('[data-action="annuler-ecart-entree"]')) { state.ecarterEntreeOuvert = null; render(); return; }

    var confirmerSuppEntreeBtn = ev.target.closest('[data-action="confirmer-suppression-entree"]');
    if (confirmerSuppEntreeBtn) {
      var delId = confirmerSuppEntreeBtn.getAttribute("data-id");
      var entreeEcartee = entrees.filter(function(e){ return e.id === delId; })[0];
      var motifElEntree = document.getElementById("motif-ecart-entree-" + delId);
      var motifEntree = motifElEntree ? motifElEntree.value.trim() : "";
      entrees = entrees.filter(function(e){ return e.id !== delId; });
      numero.entrees = entrees;
      state.ecarterEntreeOuvert = null;
      state.modal = null;
      supprimerEntreeDistante(delId);
      if (entreeEcartee) creerCandidatEcarte(entreeEcartee, motifEntree);
      render();
      return;
    }

    if (ev.target.closest('[data-action="close-modal"]') || ev.target === document.querySelector('[data-action="close-modal-backdrop"]')) {
      state.modal = null; render(); return;
    }

    var illustrationBtn = ev.target.closest('[data-action="recuperer-illustration"]');
    if (illustrationBtn) { recupererIllustration(illustrationBtn); return; }

    var illustrationsMasseBtn = ev.target.closest('[data-action="recuperer-illustrations-manquantes"]');
    if (illustrationsMasseBtn) { recupererIllustrationsManquantes(illustrationsMasseBtn); return; }

    // ---- lot 4 : impression ----
    if (ev.target.closest('[data-action="imprimer"]')) { numeroImprimer(); return; }

    // ---- lot 4 : aperçu dev de l'état limite ① ----
    if (ev.target.closest('[data-action="preview-premier"]')) {
      state.previewEtat = "premier"; state.vue = "numero"; state.mode = "publiee"; render(); return;
    }
    if (ev.target.closest('[data-action="preview-normal"]')) { state.previewEtat = null; render(); return; }

    // ---- lot 10 : moisson intégrée à l'écran du numéro (états ②③④) ----
    var retenirBtn = ev.target.closest('[data-action="retenir-candidat"]');
    if (retenirBtn) {
      var cid = retenirBtn.getAttribute("data-id");
      var cand = numero.moisson.filter(function(c){ return c.id === cid; })[0];
      if (cand) {
        numero.moisson = numero.moisson.filter(function(c){ return c.id !== cid; });
        var nouvelleEntree = {
          id: cand.id, rubrique: cand.rubrique, valide: true, origine: cand.origine,
          ordre: prochainOrdre(),
          source: cand.source, url: cand.url, lienMort: cand.lienMort, lienMortDepuis: cand.lienMortDepuis,
          titre: cand.titre, chiffres: chiffresCandidatVersBlocs(cand.chiffres), resume: cand.resume, usage: cand.usage,
          blocs: { chiffres: !!(cand.chiffres && cand.chiffres.length), resume: true }
        };
        entrees.push(nouvelleEntree);
        numero.entrees = entrees;
        creerEntree(nouvelleEntree);
        ecrireNumero({ moisson: numero.moisson });
        if (state.ecarterOuvert === cid) state.ecarterOuvert = null;
        render();
      }
      return;
    }

    // Panneau « écarter avec motif » : ouvert/fermé en place sur la carte du
    // candidat (retour d'usage du 31/08/2026 : un window.prompt() pour le
    // motif n'a pas été trouvé/vu à l'usage — le geste doit rester visible).
    var ecarterBtn = ev.target.closest('[data-action="ecarter-candidat"]');
    if (ecarterBtn) {
      var eid = ecarterBtn.getAttribute("data-id");
      state.ecarterOuvert = state.ecarterOuvert === eid ? null : eid;
      render();
      return;
    }

    if (ev.target.closest('[data-action="annuler-ecart"]')) { state.ecarterOuvert = null; render(); return; }

    var confirmerEcartBtn = ev.target.closest('[data-action="confirmer-ecart"]');
    if (confirmerEcartBtn) {
      var ceid = confirmerEcartBtn.getAttribute("data-id");
      var candEcarte = numero.moisson.filter(function(c){ return c.id === ceid; })[0];
      var motifEl = document.getElementById("motif-ecart-" + ceid);
      var motif = motifEl ? motifEl.value.trim() : "";
      numero.moisson = numero.moisson.filter(function(c){ return c.id !== ceid; });
      state.ecarterOuvert = null;
      ecrireNumero({ moisson: numero.moisson });
      if (candEcarte) creerCandidatEcarte(candEcarte, motif);
      render();
      return;
    }

    // Déplacement d'une entrée retenue vers un autre numéro (Lot 10) : bascule
    // du sélecteur inline, voir renderDeplacerPanel().
    var deplacerBtn = ev.target.closest('[data-action="toggle-deplacer"]');
    if (deplacerBtn) {
      var did = deplacerBtn.getAttribute("data-id");
      state.deplacerOuvert = state.deplacerOuvert === did ? null : did;
      state.ecarterEntreeOuvert = null;
      render();
      return;
    }

    // Ordre d'affichage au sein d'une rubrique (Lot 10bis).
    var monterBtn = ev.target.closest('[data-action="monter-entree"]');
    if (monterBtn) { deplacerOrdreEntree(monterBtn.getAttribute("data-id"), -1); return; }

    var descendreBtn = ev.target.closest('[data-action="descendre-entree"]');
    if (descendreBtn) { deplacerOrdreEntree(descendreBtn.getAttribute("data-id"), 1); return; }

    // ---- lot 4 : publication (état ⑥) ----
    if (ev.target.closest('[data-action="publier-numero"]')) {
      var fautives = validerPublication();
      if (fautives.length) {
        state.publicationRefusee = { numeroId: numero.numero, fautives: fautives };
      } else {
        numero.statut = "publie";
        ecrireNumero({ statut: "publie" });
      }
      render();
      return;
    }

    // Dépublier (Lot 10bis) : demande confirmation, remet le numéro en
    // brouillon — retiré immédiatement du Sommaire/Recherche/vue publique
    // (les vues publiques ne servent que les numéros statut=publie).
    if (ev.target.closest('[data-action="depublier-numero"]')) {
      if (window.confirm("Dépublier le n° " + numero.numero + " ? Il redevient un brouillon, invisible des élèves, jusqu'à sa republication.")) {
        numero.statut = "brouillon";
        ecrireNumero({ statut: "brouillon" });
        render();
      }
      return;
    }

    // Suppression d'un numéro entier (Lot 23) : confirmation obligatoire,
    // rappelle le nombre d'entrées emportées avec lui (supprimées en
    // cascade côté base, voir supprimerNumeroDistant()). Après coup,
    // retombe sur numeroParDefaut() comme au chargement initial — jamais
    // sur un numéro qui vient de disparaître.
    if (ev.target.closest('[data-action="supprimer-numero"]')) {
      var numeroASupprimer = numero.numero;
      var nbEntreesEmportees = entrees.length;
      var messageSuppr = "Supprimer définitivement le n° " + numeroASupprimer + " ? " +
        (nbEntreesEmportees ? "Ses " + nbEntreesEmportees + " entrée" + (nbEntreesEmportees > 1 ? "s" : "") + " seront supprimées avec lui. " : "") +
        "Cette action est irréversible.";
      if (window.confirm(messageSuppr)) {
        var okSuppr = await supprimerNumeroDistant(numeroASupprimer);
        if (okSuppr) {
          numeros.splice(numeros.indexOf(numero), 1);
          state.numeroId = numeroParDefaut();
        }
        render();
      }
      return;
    }

    var reglerBtn = ev.target.closest('[data-action="regler-fautive"]');
    if (reglerBtn) {
      state.publicationRefusee = null;
      state.modal = { mode: "edit", id: reglerBtn.getAttribute("data-id") };
      render();
      return;
    }

    if (ev.target.closest('[data-action="close-refus"]') || ev.target === document.querySelector('[data-action="close-refus-backdrop"]')) {
      state.publicationRefusee = null; render(); return;
    }

    // ---- lot 4 : sources suivies (écran 5a) ----
    if (ev.target.closest('[data-action="relancer-collecte"]')) {
      sourcesSuivies.forEach(function(s){
        if (s.derniereMoisson.statut === "echec") {
          s.derniereMoisson.statut = "ok"; delete s.derniereMoisson.detail; delete s.derniereMoisson.note;
          s.derniereMoisson.entrees = s.derniereMoisson.entrees || 0;
          ecrireSource(s.id, { derniereMoisson: s.derniereMoisson });
        }
      });
      if (numero.moisson != null) { numero.collecte.statut = "rapporte"; ecrireNumero({ collecte: numero.collecte }); }
      render();
      return;
    }

    var reessayerBtn = ev.target.closest('[data-action="source-reessayer"]');
    if (reessayerBtn) {
      var srcId = reessayerBtn.getAttribute("data-id");
      var src = sourcesSuivies.filter(function(s){ return s.id === srcId; })[0];
      if (src) {
        src.derniereMoisson.statut = "ok"; delete src.derniereMoisson.detail; delete src.derniereMoisson.note;
        src.derniereMoisson.entrees = src.derniereMoisson.entrees || 0;
        ecrireSource(src.id, { derniereMoisson: src.derniereMoisson });
        render();
      }
      return;
    }

    if (ev.target.closest('[data-action="source-add"]')) { state.modalSource = { mode: "add" }; render(); return; }

    var srcEditBtn = ev.target.closest('[data-action="source-edit"]');
    if (srcEditBtn) { state.modalSource = { mode: "edit", id: srcEditBtn.getAttribute("data-id") }; render(); return; }

    var srcRemoveBtn = ev.target.closest('[data-action="source-remove"]');
    if (srcRemoveBtn) {
      var srcRemoveId = srcRemoveBtn.getAttribute("data-id");
      if (window.confirm("Ne plus suivre cette source ?")) {
        sourcesSuivies = sourcesSuivies.filter(function(s){ return s.id !== srcRemoveId; });
        state.modalSource = null;
        supprimerSourceDistante(srcRemoveId);
        render();
      }
      return;
    }

    if (ev.target.closest('[data-action="close-modal-source"]') || ev.target === document.querySelector('[data-action="close-modal-source-backdrop"]')) {
      state.modalSource = null; render(); return;
    }

    if (ev.target.closest('[data-action="deplier-sources"]')) { state.sourcesDeplie = !state.sourcesDeplie; render(); return; }

    if (ev.target.closest('[data-action="deplier-bilan-entrees"]')) { state.bilanEntreesDeplie = !state.bilanEntreesDeplie; render(); return; }
  });

  document.addEventListener("change", function(ev){
    var toggleValide = ev.target.closest('[data-action="toggle-valide"]');
    if (toggleValide) {
      var id = toggleValide.getAttribute("data-id");
      var entree = entrees.filter(function(e){ return e.id === id; })[0];
      if (entree) { entree.valide = toggleValide.checked; ecrireEntree(id, { valide: entree.valide }); render(); }
      return;
    }

    var rubriqueSel = ev.target.closest('[data-action="recherche-rubrique"]');
    if (rubriqueSel) {
      var qEl = document.getElementById("recherche-q");
      if (qEl) state.recherche.q = qEl.value;
      state.recherche.rubrique = rubriqueSel.value;
      render();
      return;
    }

    var collecteSel = ev.target.closest('[data-action="collecte-statut"]');
    if (collecteSel) { numero.collecte.statut = collecteSel.value; ecrireNumero({ collecte: numero.collecte }); render(); }

    var numeroSel = ev.target.closest('[data-action="changer-numero"]');
    if (numeroSel) {
      state.numeroId = parseInt(numeroSel.value, 10);
      state.modal = null;
      state.ecarterOuvert = null; state.deplacerOuvert = null; state.ecarterEntreeOuvert = null;
      render();
      return;
    }

    var deplacerSel = ev.target.closest('[data-action="deplacer-select"]');
    if (deplacerSel) {
      var idADeplacer = deplacerSel.getAttribute("data-id");
      var cibleVal = deplacerSel.value;
      if (!cibleVal) return;
      if (cibleVal === "__nouveau__") {
        state.modalNumero = { erreur: null, deplacerEntreeId: idADeplacer };
      } else {
        deplacerEntreeVersNumero(idADeplacer, parseInt(cibleVal, 10));
        state.deplacerOuvert = null;
      }
      render();
      return;
    }
  });

  // Domaine affiché déduit de l'URL collée/tapée (lot 4bis) : ne complète que
  // si le champ est encore vide, pour ne jamais écraser une valeur déjà
  // saisie à la main (édition d'une entrée existante, ou correction manuelle).
  document.addEventListener("input", function(ev){
    if (!ev.target.form || ev.target.form.id !== "entree-form" || ev.target.name !== "url") return;
    var domaineField = ev.target.form.elements["domaine"];
    if (!domaineField || domaineField.value.trim()) return;
    var host = "";
    try { host = new URL(ev.target.value).hostname.replace(/^www\./, ""); } catch (err) {}
    if (host) domaineField.value = host;
  });

  // Aperçu de l'illustration synchronisé en direct sur la saisie manuelle
  // du champ (collage d'une adresse déjà connue) — le même <img> est aussi
  // mis à jour par recupererIllustration() après un appel réussi.
  document.addEventListener("input", function(ev){
    if (!ev.target.form || ev.target.form.id !== "entree-form" || ev.target.name !== "imageUrl") return;
    var apercuEl = ev.target.form.querySelector(".illustration-apercu");
    if (!apercuEl) return;
    var v = ev.target.value.trim();
    apercuEl.src = v;
    apercuEl.hidden = !v;
  });

  // Illustration du numéro (Lot 16) : champ hors formulaire, pas de
  // soumission — enregistré au blur, comme les champs ed() du reste de la
  // page (titre, chapo...), sans passer par ce mécanisme (ce n'est pas un
  // span contenteditable mais un <input> classique).
  document.addEventListener("focusout", function(ev){
    if (ev.target.id !== "champ-image-numero") return;
    var v = ev.target.value.trim();
    if (v === (numero.imageUrl || "")) return;
    numero.imageUrl = v || null;
    ecrireNumero({ image_url: numero.imageUrl });
    render();
  });

  document.addEventListener("focusout", function(ev){
    var el = ev.target.closest && ev.target.closest('[data-ed="true"]');
    if (!el) return;
    var path = el.getAttribute("data-path");
    var value = el.textContent.replace(/\s+/g, " ").trim();
    setEdValue(path, value);
    persisterEdValue(path);
    render();
  });

  document.addEventListener("keydown", function(ev){
    if (ev.key !== "Escape") return;
    if (state.modal) { state.modal = null; render(); return; }
    if (state.modalSource) { state.modalSource = null; render(); return; }
    if (state.modalAuth) { state.modalAuth = null; render(); return; }
    if (state.modalNumero) { state.modalNumero = null; render(); return; }
    if (state.ecarterOuvert) { state.ecarterOuvert = null; render(); return; }
    if (state.deplacerOuvert) { state.deplacerOuvert = null; render(); return; }
    if (state.ecarterEntreeOuvert) { state.ecarterEntreeOuvert = null; render(); return; }
    if (state.publicationRefusee) { state.publicationRefusee = null; render(); return; }
  });

  document.addEventListener("submit", async function(ev){
    if (ev.target.id === "recherche-form") {
      ev.preventDefault();
      var qEl = document.getElementById("recherche-q");
      state.recherche.q = qEl ? qEl.value : "";
      render();
      return;
    }

    if (ev.target.id === "source-form") {
      ev.preventDefault();
      var sf = ev.target.elements;
      function sval(name){ return sf[name] ? sf[name].value.trim() : ""; }

      var editingS = state.modalSource && state.modalSource.mode === "edit";
      var sid = editingS ? state.modalSource.id : "s" + Date.now();
      var existingS = editingS ? sourcesSuivies.filter(function(x){ return x.id === sid; })[0] : null;

      var srcEntry = {
        id: sid,
        nom: sval("nom"), adresse: sval("adresse"), type: sval("type") || "flux RSS",
        echelle: sval("echelle"), territoire: sval("territoire"), rubriqueDefaut: sval("rubriqueDefaut"),
        derniereMoisson: existingS ? existingS.derniereMoisson : { date: dateImpression(), statut: "ok", entrees: 0 },
        compteurs: existingS ? existingS.compteurs : { retenues: 0, rapportees: 0 }
      };
      if (existingS) sourcesSuivies[sourcesSuivies.indexOf(existingS)] = srcEntry;
      else sourcesSuivies.push(srcEntry);

      state.modalSource = null;
      creerOuRemplacerSource(srcEntry);
      render();
      return;
    }

    if (ev.target.id === "auth-form") {
      ev.preventDefault();
      var af = ev.target.elements;
      var email = (af.email.value || "").trim().toLowerCase();
      var mdp = af.motdepasse.value || "";
      state.modalAuth = { erreur: null, enCours: true }; render();
      try {
        var resAuth = await connexionOuCreation(email, mdp);
        state.auth.user = resAuth.user; state.auth.redacteur = resAuth.redacteur;
        if (resAuth.redacteur.actif) {
          state.modalAuth = null;
          await chargerDonneesRedaction();
        } else {
          state.modalAuth = { erreur: null, enCours: false };
        }
      } catch (e) {
        state.modalAuth = { erreur: e.message || "Erreur de connexion.", enCours: false };
      }
      render();
      return;
    }

    if (ev.target.id === "numero-form") {
      ev.preventDefault();
      var nf = ev.target.elements;
      var num = parseInt(nf.numero.value, 10);
      var renommerAncien = state.modalNumero.renommer;

      // Renumérotation (Lot 23) : formulaire sans champ Semaine (voir
      // renderModalNumero()), donc branché avant le reste — même contrôle
      // d'unicité que la création, sauf qu'on s'autorise à retomber sur le
      // numéro déjà en place (aucun changement, fermeture silencieuse).
      if (renommerAncien != null) {
        if (!num || numeros.some(function(n){ return n.numero === num && n.numero !== renommerAncien; })) {
          state.modalNumero = { erreur: "Numéro invalide ou déjà utilisé.", renommer: renommerAncien }; render(); return;
        }
        if (num === renommerAncien) { state.modalNumero = null; render(); return; }
        var okRenommer = await renommerNumeroDistant(renommerAncien, num);
        if (!okRenommer) { render(); return; }
        numero.numero = num;
        if (state.numeroId === renommerAncien) state.numeroId = num;
        state.modalNumero = null;
        render();
        return;
      }

      if (!num || numeros.some(function(n){ return n.numero === num; })) {
        state.modalNumero = { erreur: "Numéro invalide ou déjà utilisé." }; render(); return;
      }
      var semaineInfo = formaterSemaineIso(nf.semaineIso.value);
      if (!semaineInfo) {
        state.modalNumero = { erreur: "Semaine invalide." }; render(); return;
      }
      var nouveauNumero = {
        numero: num, statut: "brouillon", mois: semaineInfo.mois,
        semaine: semaineInfo.semaine, titre: "", chapo: "", candidates: 0,
        collecte: null, moisson: null, vues: 0, entrees: []
      };
      var ok = await creerNumeroDistant(nouveauNumero);
      if (!ok) { render(); return; }
      numeros.push(nouveauNumero);
      // « + Nouveau numéro » choisi depuis le sélecteur « Déplacer vers… »
      // d'une entrée (Lot 10) : termine le déplacement une fois le numéro créé,
      // avant de rebasculer numeroId (deplacerEntreeVersNumero() déplace
      // depuis le numéro actuellement affiché, donc avant ce changement).
      var deplacerId = state.modalNumero.deplacerEntreeId;
      if (deplacerId) deplacerEntreeVersNumero(deplacerId, num);
      state.modalNumero = null;
      state.numeroId = num;
      state.deplacerOuvert = null;
      render();
      return;
    }

    if (ev.target.id !== "entree-form") return;
    ev.preventDefault();
    var f = ev.target.elements;
    function val(name){ return f[name] ? f[name].value.trim() : ""; }

    var editing = state.modal && state.modal.mode === "edit";
    var id = editing ? state.modal.id : "e" + Date.now();
    var existing = editing ? entrees.filter(function(x){ return x.id === id; })[0] : null;
    var chiffres = parseChiffres(val("chiffres"));
    var rubriqueSaisie = val("rubrique") || "Sans rubrique";

    var entry = {
      id: id,
      rubrique: rubriqueSaisie,
      valide: existing ? existing.valide : true,
      origine: existing ? existing.origine : "manuel",
      // Conserve la place déjà occupée en modification ; une nouvelle
      // entrée s'ajoute en fin du numéro (Lot 10bis, à plat depuis le Lot 17).
      ordre: existing ? existing.ordre : prochainOrdre(),
      source: { nom: val("nom"), territoire: val("territoire"), domaine: val("domaine"), date: val("date") },
      url: val("url") || ("#" + id),
      titre: val("titre"),
      imageUrl: val("imageUrl") || null,
      chiffres: chiffres,
      resume: val("resume"),
      usage: val("usage") || null,
      blocs: existing
        ? { chiffres: existing.blocs.chiffres && !!chiffres.length, resume: existing.blocs.resume }
        : { chiffres: !!chiffres.length, resume: true }
    };

    if (existing) {
      entrees[entrees.indexOf(existing)] = entry;
      var champsEntree = {}; Object.keys(entry).forEach(function(k){ if (k !== "id") champsEntree[k] = entry[k]; });
      ecrireEntree(id, champsEntree);
    } else {
      entrees.push(entry);
      creerEntree(entry);
    }

    state.modal = null;
    render();
  });

  // ---- Amorçage (Lot 6+7) : async — attend la lib Supabase puis la session
  // avant le premier rendu (contrairement à l'ancien loadData() synchrone).
  async function init(){
    var app = document.getElementById("app");
    app.innerHTML = '<div class="etat-limite"><span class="glyphe">◇</span><h1>Chargement…</h1></div>';
    try { await waitForSupabaseLib(); }
    catch (e) {
      app.innerHTML = '<div class="etat-limite"><span class="glyphe">⚠</span><h1>Connexion impossible</h1><p>' + esc(e.message) + '</p></div>';
      return;
    }
    var s = client();
    try {
      var sess = await s.auth.getSession();
      if (sess.data && sess.data.session) {
        state.auth.user = sess.data.session.user;
        try { state.auth.redacteur = await chargerRedacteur(state.auth.user.id); }
        catch (e) { /* profil rédacteur indisponible : reste en lecture publique */ }
      }
    } catch (e) { /* pas de session : lecture publique */ }

    try { await chargerDonnees(); }
    catch (e) {
      app.innerHTML = '<div class="etat-limite"><span class="glyphe">⚠</span><h1>Chargement impossible</h1><p>' + esc(e.message || "erreur réseau") + '</p></div>';
      return;
    }
    state.numeroId = numeroParDefaut();
    render();

    s.auth.onAuthStateChange(function(event){
      if (event === "SIGNED_OUT") {
        state.auth.user = null; state.auth.redacteur = null; state.mode = "publiee";
        if (state.vue === "sources") state.vue = "numero";
        chargerDonneesPubliques().then(function(){ state.numeroId = numeroParDefaut(); render(); });
      }
    });
  }

  // Re-rendu au redimensionnement (Lot 20) : le franchissement du seuil
  // mobile (mobileActif()) change le HTML émis en rédaction (titre-bouton
  // vs édition en place) — sans ça, ce changement n'apparaîtrait qu'au
  // prochain rendu déclenché par autre chose (rotation d'écran, DevTools
  // redimensionnées…). Anti-rebond léger : un redimensionnement déclenche
  // beaucoup d'événements pendant qu'on tire la fenêtre.
  var minuteurResize = null;
  window.addEventListener("resize", function(){
    clearTimeout(minuteurResize);
    minuteurResize = setTimeout(render, 150);
  });

  init();
})();
</script>
